<script type="module">
import * as THREE from "three";
"use strict";

// ---------- コースデータ（JSON。course.json が正本で、ここには同じ内容を埋め込む） ----------
// 編集は course-editor.html で行い、node sync-course.js で埋め込み直す。
// ?course=local のときだけ、エディタが localStorage に置いた編集中コースを読む（試走用）。
// 読み込みに失敗した場合は従来のコース（直線・上り坂つき）と同一の既定値を使う。
const COURSE_DEFAULT = { goalDist: 5800, checkpoint: 2900, step: 3200, jump: 4600,
  elevation: [{ d: 0, h: 0 }, { d: 800, h: 0 }, { d: 2600, h: 5 }, { d: 5800, h: 5 }],
  centerline: [{ d: 0, x: 0 }, { d: 5800, x: 0 }],
  obstacles: [
    { x: 1400, lane: 1, halfW: 70, type: "truck" },
    { x: 2100, lane: 2, halfW: 70, type: "cones" },
    { x: 3800, lane: 2, halfW: 62, type: "crates" },
    { x: 5300, lane: 0, halfW: 70, type: "cones", flag: true },
  ] };
function loadCourse() {
  try {
    if (new URLSearchParams(location.search).get("course") === "local") {
      const raw = localStorage.getItem("demae-course-override");
      if (raw) return JSON.parse(raw);
    }
  } catch (e) {}
  try {
    const el = document.getElementById("courseJson");
    if (el && el.textContent.trim()) return JSON.parse(el.textContent);
  } catch (e) { console.error("course JSON parse failed, using defaults", e); }
  return COURSE_DEFAULT;
}
const COURSE = loadCourse();
// 制御点の補間（標高・中心線とも同じ流儀：制御点間を smoothstep でつなぐ。
// 旧 slopeY（800→2600 の smoothstep）は制御点 0,0 / 800,0 / 2600,5 / 5800,5 と一致する）
function profileAt(pts, d, key) {
  if (d <= pts[0].d) return pts[0][key];
  for (let i = 1; i < pts.length; i++) {
    if (d <= pts[i].d) {
      const u = (d - pts[i - 1].d) / (pts[i].d - pts[i - 1].d);
      const s = 3 * u * u - 2 * u * u * u;
      return pts[i - 1][key] + (pts[i][key] - pts[i - 1][key]) * s;
    }
  }
  return pts[pts.length - 1][key];
}

/* ================================================================
   出前ダッシュ!! 3D版 土台v1
   ゲームロジック（状態・塔の物理・のびタイマー・入力）は
   2D版（../game/index.html）からの移植そのまま。
   描画だけを Three.js (WebGL) に差し替えた。
   単位の対応：2D版の dist 58 ≒ 3Dの 1 ユニット（HUDの「m」表示と同じ換算）
   ================================================================ */

// ---------- 状態（2D版と同一） ----------
let state = "title"; // title | play | goal | fail
let t = 0, dist = 0, speed = 0, lane = 1, laneX = 0; // lane: 0,1,2
let theta = 0, omega = 0;      // 塔の傾き（前＋／後−）と角速度
let sway = 0, swayV = 0;       // 横方向の揺れ（進路変更で生まれる）
let plates = 5, choko = true;  // 残りざる枚数／猪口あり
let chokoFall = -1, slipFall = -1, collapseT = -1;
let invuln = 0, kataAcc = 0, shake = 0, hop = 0, kataHold = 0;
let stepDone = false, jumpDone = false, airT = -1, airDur = 0, jumpSpeed = 0, jumpY = 0, firstRun = true, slowT = 0;
let checkpointDone = false, checkpointT = 0, checkpointShow = 0; // 鳥居チェックポイント（通過記録のみ）
let braking = false, peeking = false, peekF = 0;
let btnBrake = false, btnPeek = false, touchBrake = false; // 入力ソース別（毎フレーム合成する）
let goalT = 0, failMsg = "";
const GOAL_DIST = COURSE.goalDist, CHECK_X = COURSE.checkpoint, STEP_X = COURSE.step, JUMP_X = COURSE.jump; // コースJSONから読む（2026-11-08 C回にデータ化）。全力で走って約40秒になるよう調整（第1週で実測）
const UNIT = 58; // dist → 3Dユニット換算
// ---------- 障害物（2026-11-05 ユーザー決定。進路変更を強いる。2026-11-05 C回で実装） ----------
// 位置は鳥居(2900)・段差(3200)・ジャンプ台(4600)から離し、衝撃が重ならないようにする。
// 当たった場合の衝撃は段差と同程度（0.4 + speed*0.003）を角速度へ加える流儀で、
// 単独では猪口・滑落のしきい値に届かず、ブレーキなどと重なったときだけ滑落に進む。
// 崩壊には届かない設計。避ければ何も起きない。判定は障害物ごとに1回だけ。
// halfW は当たり判定の半幅（laneX単位。隣の車線の中心までは90あるので、隣の車線に
// すっぽり入っていれば当たらない。車線変更の途中でかすめると当たる）。
// ---------- 判断の連続（2026-11-07 ユーザー決定。2026-11-07 C回で連なりに組み替え） ----------
// 前の判断の結果が次の判断に影響する配置。避けた先の車線に次の障害物が来る。
// ・1400中央の軽トラを左へ避ける → 2100は右のコーン（切り返し。左のままだと当たらないが、
//   そのまま左にいると3800の右の荷物は避けられる代わりに5300の左のコーンに当たる）。
// ・3200段差で揺れたまま → 3800は右の荷物（揺れた状態での回避。従来どおり）。
// ・ジャンプ着地（約4760）の直後 → 5300は左のコーン（5100→5300へ。着地から約540・
//   約2.9秒の余裕に広げ、着地ピーク0.28のまま判断させない。3800で左へ避けた人は
//   そのまま左にいると当たるので、着地のあと中央へ寄る判断が要る）。
//   5300は画面左端で小さく、遠方ではほとんど読めなかったため、看板より高い旗
//   （柱3.6・白い旗）を立てて遠くから読めるようにした（2026-11-08 A回。見た目だけ）。
// 抜けられるライン：左→中央→左→中央（自動走行Pで確認）。塔の物理の核・しきい値・
// 鳥居／段差／ジャンプ台の位置は無変更。軽トラ（1400・中央）の位置も確定仕様のまま。
const OBSTACLES = COURSE.obstacles.map(o => ({ ...o, hit: false })); // コースJSONから読む（2026-11-08 C回にデータ化）
let obstacleHits = 0;
let hitJolt = 0; // 障害物に当たった瞬間の描画だけの揺れ（衝撃の見た目。物理のtheta・しきい値には触れない）

// ---------- 上り坂（2026-11-06 C回。見た目だけの坂。物理・速度には触れない） ----------
// チェイス視点で先の道が持ち上がって見え、軽トラ（1400・中央）が塔の裏に
// 隠れにくくなるかの実験。2026-11-08 C回にコースJSONへ切り出し（標高プロファイル）。
// 速度への影響は入れない（意図的に。物理の聖域に触れず、自動走行の数値を
// 変えずに「見え方だけ」の実験にするため）。坂の先に海が見下ろせる構図は、
// 素材第3便の vista_sea_01（坂の上から見下ろす港町と海）と同じ約束。
function slopeY(d) { // コース距離 d における地面の高さ（3D単位。コースJSONの標高プロファイル）
  return profileAt(COURSE.elevation, d, "h");
}
function slopeDeriv(d) { // slopeY の d による微分（道路の傾き用。数値微分で十分。見た目だけ）
  const e = 20;
  return (slopeY(d + e) - slopeY(d - e)) / (2 * e);
}
// ---------- 道の中心線（2026-11-08 C回。コースJSONの centerline。見た目だけ） ----------
// 道が左右に曲がる。中心線の x は3D単位（道幅5.6に対し |x|≦4 程度が目安）。
// バイク・道路・路側物・障害物・鳥居・段差・ジャンプ台・橋本さん宅は
// すべて中心線に沿って横へずらす。車線（laneX）は中心線からの相対位置の
// ままなので、塔の物理・当たり判定・自動走行の数値は変わらない。
function centerX(d) { return profileAt(COURSE.centerline, d, "x"); }
function centerDeriv(d) { // 中心線の傾き（3D単位/dist。道路の板のヨー角用）
  const e = 20;
  return (centerX(d + e) - centerX(d - e)) / (2 * e);
}

// ---------- 音（2D版のWebAudio合成を流用） ----------
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function noiseBurst(dur, vol, freq) {
  const a = ac(); if (!a) return;
  const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq || 1200;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
function thud() { const a = ac(); if (!a) return; const o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(120, a.currentTime); o.frequency.exponentialRampToValueAtTime(40, a.currentTime + 0.25);
  g.gain.setValueAtTime(0.25, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.3); }
function checkpointSound() { const a = ac(); if (!a) return; // チェックポイント通過の短い2音（合成音のみ）
  [880, 1318].forEach((fr, i) => { const o = a.createOscillator(), g = a.createGain(); const t0 = a.currentTime + i * 0.09;
    o.type = "sine"; o.frequency.setValueAtTime(fr, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + 0.25); }); }

// ---------- エンジン音と風の音（2026-11-06 C回。スピード感の演出。合成音のみ） ----------
// 速度に連動するだけの演出で、物理・しきい値には触れない。音量は小さめにし、
// カタカタやチェックポイントの音を邪魔しない。タイトル・ゴール・失敗時は無音になる。
let engineOsc = null, engineGain = null, windSrc = null, windGain = null, windFilter = null;
function engineStart() {
  const a = ac(); if (!a) return;
  if (!engineOsc) {
    engineOsc = a.createOscillator(); engineOsc.type = "sawtooth"; engineOsc.frequency.value = 55;
    engineGain = a.createGain(); engineGain.gain.value = 0;
    engineOsc.connect(engineGain); engineGain.connect(a.destination); engineOsc.start();
    const len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    windSrc = a.createBufferSource(); windSrc.buffer = buf; windSrc.loop = true;
    windFilter = a.createBiquadFilter(); windFilter.type = "bandpass"; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
    windGain = a.createGain(); windGain.gain.value = 0;
    windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(a.destination); windSrc.start();
  }
  if (a.state === "suspended") a.resume();
}
function engineUpdate() {
  if (!engineOsc) return;
  const f = Math.min(1, Math.max(0, speed / 195));
  engineOsc.frequency.value = 55 + speed * 0.45; // 巡航150で約122Hz、全開195で約143Hz
  engineGain.gain.value = state === "play" ? 0.016 + f * 0.02 : 0;
  windFilter.frequency.value = 300 + speed * 4;
  windGain.gain.value = state === "play" ? f * f * 0.04 : 0;
}

// ---------- 入力（2D版と同一。対象要素が canvas → #gl に変わるだけ） ----------
const glEl = document.getElementById("gl");
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return; keys[e.code] = true;
  if (e.code === "ArrowLeft") changeLane(-1);
  if (e.code === "ArrowRight") changeLane(1);
  if (e.code === "Enter" || e.code === "Space") { if (state === "title" || state === "goal" || state === "fail") start(); }
});
addEventListener("keyup", e => { keys[e.code] = false; });
function holdBtn(el, on, off) {
  const s = e => { e.preventDefault(); ac(); on(); el.classList.add("hold"); };
  const x = e => { e.preventDefault(); off(); el.classList.remove("hold"); };

function changeLane(d) {
  if (state !== "play") return;
  const nl = Math.min(2, Math.max(0, lane + d));
  if (nl !== lane) { lane = nl; swayV += d * 2.2; } // 進路変更そのものが揺れを生む
}
function start() {
  state = "play"; t = 0; dist = 0; speed = 0; lane = 1; laneX = 0;
  theta = 0; omega = 0; sway = 0; swayV = 0; plates = 5; choko = true;
  chokoFall = -1; slipFall = -1; collapseT = -1; invuln = 0; shake = 0; hop = 0;
  stepDone = false; jumpDone = false; airT = -1; jumpY = 0; slowT = firstRun ? 6 : 0; goalT = 0; failMsg = "";
  checkpointDone = false; checkpointT = 0; checkpointShow = 0;
  for (const o of OBSTACLES) o.hit = false; obstacleHits = 0;
  engineStart(); // エンジン音と風の音を始める（タイトル・ゴール・失敗時は無音）
}

// ---------- 更新（2D版からそのまま移植） ----------
function update(dt) {
  if (state !== "play") return;
  t += dt;
  if (touchActive && !touchMoved && performance.now() - touchT > 150) touchBrake = true;
  braking = btnBrake || touchBrake || !!keys["Space"];
  peeking = btnPeek || !!keys["KeyP"];
  peekF += ((peeking ? 1 : 0) - peekF) * Math.min(1, dt * 8);
  const slowF = slowT > 0 ? 0.6 : 1; if (slowT > 0) slowT -= dt;
  // アクセル自動化（2026-11-07 ユーザー決定。2026-11-06の長押しアクセルは廃止）：
  // 上限速度は走り出し150から1秒に1.2ずつ上がり、37.5秒で195に達する。
  // 走行中ずっと上がり続ける（ゴールまで上がり切らない）ので、ジャンプ台
  // （約26秒地点）では約181と、全開195のときの着地ピーク0.29より少し余裕がある。
  // 速くなるほど段差・着地の衝撃が大きい既存の速度依存が、そのまま速さの代償になる。
  // ブレーキで速度を落とす判断が中心になる。塔の物理の核・しきい値は無変更。
  const vmax = (150 + Math.min(45, t * 1.2)) * slowF;
  if (braking) speed = Math.max(0, speed - 260 * dt);
  else speed = Math.min(vmax, speed + 95 * dt);
  dist += speed * dt;

  // 鳥居チェックポイント（中間地点。通過の記録と表示だけで、物理・評価・のびタイマーには触れない）
  if (!checkpointDone && dist >= CHECK_X) { checkpointDone = true; checkpointT = t; checkpointShow = 2.2; checkpointSound(); }
  if (checkpointShow > 0) checkpointShow = Math.max(0, checkpointShow - dt);

  // ジャンプ台（地形。段差の発展としてゴール手前に1つ置く。ボタンジャンプではない）
  if (!jumpDone && airT < 0 && dist >= JUMP_X) { jumpDone = true; airT = 0; airDur = 0.45 + speed * 0.0025; jumpSpeed = speed; }

  // 車線のなめらかな移動（横方向の加速度が揺れになる）
  const targetX = (lane - 1) * 90;
  const prevX = laneX;
  laneX += (targetX - laneX) * Math.min(1, dt * 6);
  const latA = (laneX - prevX) / Math.max(dt, 1e-4);
  const peekGain = 1 + peekF * 0.6; // 覗いている間は片手運転で余計に揺れる

  // 塔の物理：傾きは運転入力だけで決まる（独りでに揺れる仕様はなし）
  // 調整根拠（2D版の自動走行テスト）：通常走行の最大傾きは約0.11、
  // 1回のブレーキで約0.26、ブレーキ＋進路変更＋のぞきの荒い運転で約0.38〜0.49
  // 空中（ジャンプ台で飛んでいる間）は運転入力が塔に伝わらない。
  // バネと減衰だけが働き、新しい傾きは生まれない。着地の衝撃は別途加える。
  const airborne = airT >= 0;
  let drive = 0;
  if (!airborne) {
    if (braking) drive += 4.0;            // ブレーキで前へ傾く
    else if (speed < vmax - 1) drive -= 1.1; // 加速で後ろへ傾く（上限が上がり続けるので、走行中はほぼ常に少し後ろへ傾く）
    drive += latA * 0.02 * peekGain;      // 進路変更の横揺れ（単独では猪口に届かず、ブレーキとの複合で滑落・崩壊に届く強さ）
  }
  omega += (-16 * theta - 5.5 * omega + drive) * dt;
  theta += omega * dt;
  if (airborne) swayV += (-12 * sway - 4.5 * swayV) * dt;
  else swayV += (-12 * sway - 4.5 * swayV + latA * 0.006 * peekGain) * dt;
  sway += swayV * dt;
  theta = Math.max(-1.3, Math.min(1.3, theta));

  // 小さな段差：1回だけの衝撃（いきなり崩壊する段差は置かない）。
  // 衝撃は速度依存：ゆっくり越えれば小さく、全速だと大きい
  if (!stepDone && dist >= STEP_X) { stepDone = true; omega += 0.4 + speed * 0.003; hop = 1; }
  if (hop > 0) hop = Math.max(0, hop - dt * 3);

  // 障害物：進路変更を強いる。避ければ何も起きず、当たったら段差と同じ流儀で
  // 角速度へ衝撃を加える（段差と同程度）。判定は障害物ごとに1回だけ。
  // 無敵時間中も衝撃自体は加わる（段差と同じ扱い。3段階の判定は無敵時間が守る）。
  for (const o of OBSTACLES) {
    if (!o.hit && dist >= o.x) {
      o.hit = true;
      if (Math.abs(laneX - (o.lane - 1) * 90) < o.halfW) {
        obstacleHits++;
        omega += 0.4 + speed * 0.003; hop = 1; noiseBurst(0.2, 0.2, 800);
        hitJolt = 1; shake = Math.max(shake, 4); // 描画のみ：当たった瞬間の揺れと画面のぶれ。物理には触れない。
      }
    }
  }

  // ジャンプ中の飛行と着地：飛ぶ距離と着地の衝撃は離陸時の速度で決まる。
  // 着地だけでは崩壊しない（きれいに速く飛んでも傾きのピークは約0.25で、
  // 猪口のしきい値0.30には届かず、警告の「カタカタ」範囲に収まる設計。
  // 遅く飛べばピークは約0.15まで小さくなる。傾きのピークは角速度の
  // 約0.107倍という、この塔のバネ・減衰の実測換算で決めた）。
  // 着地の衝撃は角速度として加え、傾きが育ってから3段階の判定にかかる。
  // すでに傾いている状態で飛ぶと、着地で滑落・崩壊に進むこともある（3段階の範囲内）。
  if (airT >= 0) {
    airT += dt;
    jumpY = Math.sin(Math.PI * Math.min(1, airT / airDur)) * (0.35 + jumpSpeed * 0.002);
    if (airT >= airDur) { airT = -1; jumpY = 0; omega += 0.8 + jumpSpeed * 0.010; hop = Math.max(hop, 0.6); noiseBurst(0.15, 0.15, 700); }
  }

  if (invuln > 0) invuln -= dt;
  const a = Math.abs(theta);
  // カタカタ：傾き連動の予告音（猪口のしきい値より手前から鳴る）
  if (a > 0.18) { kataAcc += dt; const iv = Math.max(0.06, 0.3 - a * 0.22);
    if (kataAcc > iv) { kataAcc = 0; noiseBurst(0.03, 0.12, 1800); } }
  if (a > 0.18) shake = Math.min(6, a * 8); else shake = Math.max(0, shake - dt * 20);
  // 「カタカタ…」の表示だけ、しきい値を割った後も0.9秒残す（見た目のみ。
  // 傾きの振動はしきい値をまたぐため、静止画では一瞬しか読めなかった対策）。
  // 物理・しきい値・音の条件は変えていない。
  if (a > 0.18) kataHold = 0.9; else kataHold = Math.max(0, kataHold - dt);

  // 失敗3段階（回復可能 → 滑落 → 崩壊）
  // しきい値：猪口0.30／滑落0.35／崩壊0.44（通常走行の最大約0.11より十分上、
  // 1回のブレーキのピーク約0.26では猪口は落ちず、ブレーキ＋進路変更の
  // 荒い運転で滑落に届き、段差と複合した最も極端な運転でのみ崩壊に届く）
  // 判定は大きい方から行う：傾きはフレームごとに徐々に育つので、
  // 実際には猪口→滑落→崩壊の順に一段ずつ進む
  if (invuln <= 0) {
    if (a > 0.44) { state = "fail"; collapseT = 0; failMsg = "塔が崩れてしまった…"; thud(); noiseBurst(0.5, 0.3, 500); }
    else if (a > 0.35 && plates > 0) { plates--; slipFall = 0; invuln = 1.6; omega *= 0.4; noiseBurst(0.25, 0.2, 900); }
    else if (choko && a > 0.30) { choko = false; chokoFall = 0; noiseBurst(0.15, 0.15, 2400); } // 猪口＝警告役、最初に滑る
  }
  if (chokoFall >= 0) chokoFall += dt;
  if (slipFall >= 0) slipFall += dt;
  if (state === "play" && dist >= GOAL_DIST) { state = "goal"; goalT = 0; }
}
/* のびタイマー：麺の鮮度は時間で下がり、ざるを落とすとさらに下がる。
   評価は「到着タイム（→鮮度）× 残った枚数 × 満足度」で出す（第1週は暫定式、第3週で調整） */
function nobiPct() { return Math.max(0, Math.min(100, 100 - t * 1.25 - (5 - plates) * 6 - (choko ? 0 : 4))); }
function grade() { const n = nobiPct();
  if (n >= 70) return "できたて！"; if (n >= 45) return "まだおいしい"; return "のびてきた…"; }
function satisfaction() { return Math.round(nobiPct() * plates / 5); }
function rank() { const s = satisfaction();
  if (plates === 5 && s >= 80) return "S"; if (s >= 65) return "A"; if (s >= 45) return "B"; return "C"; }

// 補間係数 p：aspect 1 で 0（横長パラメータ）、aspect 0.46 以下で 1（縦長パラメータ）。
const CAM_LAND = { fov: 58, dist: 7.4, height: 3.05, lookY: 1.5 };

let camParams = { fov: CAM_LAND.fov, dist: CAM_LAND.dist, height: CAM_LAND.height, lookY: CAM_LAND.lookY };
function fitViewport() {
  const w = glEl.clientWidth || 960, h = glEl.clientHeight || 540;
  renderer.setSize(w, h);
  const aspect = w / h;
  camera.aspect = aspect;
  const p = Math.min(1, Math.max(0, (1 - aspect) / 0.54));
  const mix = (a, b) => a + (b - a) * p;
  camParams = { fov: mix(CAM_LAND.fov, CAM_PORT.fov), dist: mix(CAM_LAND.dist, CAM_PORT.dist),
    height: mix(CAM_LAND.height, CAM_PORT.height), lookY: mix(CAM_LAND.lookY, CAM_PORT.lookY) };
  camera.fov = camParams.fov;
  camera.updateProjectionMatrix();
}

function buildVespa() {
  const root = new THREE.Group(); root.name = "ベスパ (.pgl)";
  const layerGroups = new Map();
  for (const [id, name] of VESPA_PGL.layers) {
    const g = new THREE.Group(); g.name = name; layerGroups.set(id, g); root.add(g);
  }
  const buckets = new Map();
  for (const face of VESPA_PGL.faces) {
    const layer = face[0], color = VESPA_PGL.colors[face[1]], idx = face.slice(2);
    const key = layer + "|" + color;
    if (!buckets.has(key)) buckets.set(key, { layer, color, positions: [] });
    const pos = buckets.get(key).positions;
    const point = i => [VESPA_PGL.verts[i * 3], VESPA_PGL.verts[i * 3 + 1], VESPA_PGL.verts[i * 3 + 2]];
    for (let k = 1; k + 1 < idx.length; k++) { // 多角形を扇状に三角形化
      for (const i of [idx[0], idx[k], idx[k + 1]]) pos.push(...point(i));
    }
  }
  for (const b of buckets.values()) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(b.positions, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
      color: new THREE.Color(b.color), flatShading: true, side: THREE.DoubleSide
    }));
    layerGroups.get(b.layer).add(mesh);
  }
  // .pgl の前方 +z を、ゲームの前方 -Z へ向ける。
  root.rotation.y = Math.PI;
  return root;
}

  g.add(box(1.4, 0.4, 0.06, 0x2e4a5a, 0, 1.05, -1.38)); // フロントガラス
  for (const [wx, wz] of [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.85], [0.8, 0.85]]) {

  // 一番上は赤にして、ベージュの塔と色で区別できるようにする）

// ---------- スクーター＋運転手＋出前箱＋ざるの塔 ----------
// 前方 = -Z。カメラ（+Z側）から近い順：出前箱・塔（ベスパ後部）→ 運転手 → ハンドル・前輪。
// 運転手はベスパのシートに座り、肘が塔の左右に出ることで「塔の後ろの人」と読めるようにする。
const bike = new THREE.Group(); scene.add(bike);
const ZARU_PITCH = 0.16, BOX_TOP = 1.5, TOWER_Z = 0.70, TOWER_WIDTH = 1.24, ZARU_DEPTH = 1.02;
// 猪口は最上段の「手前右の隅」に置く（2026-11-02 ユーザー指示）。真ん中だと運転手の頭と
// 同じ軸・同じ高さで重なって見分けにくいため。カップ半径0.17に対して、
// x: 0.42+0.17=0.59 ≤ 塔の半幅0.62、z: 0.30+0.17=0.47 ≤ 塔の半奥行き0.51 で、ざるからはみ出さない。
const CHOKO_DX = 0.42, CHOKO_DZ = 0.30;
let towerGroup, chokoMesh, plateMeshes = [], fallChokoMesh, fallPlateMesh, riderHeadParts, groundShadow, groundShadowMat;
{
  // 影（地面のブロブ。見た目だけの改善2026-11-03 B回：バイクの子にすると
  // ジャンプで影まで浮いて空中感が消えるため、地面に残す独立した影にした。
  // 浮くほど小さく・薄くなり、バイクと影の離れで高さが読める）
  groundShadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 });
  groundShadow = new THREE.Mesh(new THREE.CircleGeometry(1.08, 20), groundShadowMat);
  groundShadow.rotation.x = -Math.PI / 2; groundShadow.position.y = 0.015; groundShadow.scale.set(1.02, 1.18, 1); scene.add(groundShadow);
  // polygonline 用ベスパ（.pgl を埋め込み、面色と4レイヤーを保持）
  // モデル実寸：全長2.005×全幅0.78×全高1.200。前寄りシート上面は y=0.97、
  // 後部シート上面は y=0.88（いずれも回転前のモデル座標で確認）。
  bike.add(buildVespa());

  // 運転手（ベスパの前寄りシートに座る。回転後の着座位置は z≈+0.05）
  // 塔の両脇に肘が出るよう、肩から肘を外へ張り、そこからベスパの
  // ハンドルグリップ（回転後：x=±0.27〜0.38、y=1.065〜1.135、z=-0.29〜-0.335）へ前腕を伸ばす。
  const rider = new THREE.Group(); rider.position.set(0, 0, 0.05); bike.add(rider);
  function limb(a, b, r, color) {
    const va = new THREE.Vector3(a[0], a[1], a[2]), vb = new THREE.Vector3(b[0], b[1], b[2]);
    const dir = vb.clone().sub(va), len = dir.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat(color));
    m.position.copy(va).add(vb).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return m;
  }
  rider.add(box(0.62, 0.22, 0.36, 0x33475e, 0, 1.03, 0.02)); // 骨盤（シートに接する）
  rider.add(box(0.72, 0.96, 0.34, 0x3b5a80, 0, 1.50, 0.02)); // 上体（肩幅に合わせ従来より拡大）
  rider.add(box(0.86, 0.20, 0.36, 0x3b5a80, 0, 1.94, 0.02)); // 肩
  for (const s of [-1, 1]) {
    rider.add(limb([s * 0.38, 1.93, 0], [s * 0.88, 1.62, -0.07], 0.085, 0x3b5a80)); // 上腕（肘を塔の外へ）
    rider.add(limb([s * 0.88, 1.62, -0.07], [s * 0.325, 1.10, -0.36], 0.075, 0x3b5a80)); // 前腕（グリップへ）
    const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), mat(0x3b5a80));
    elbow.position.set(s * 0.88, 1.62, -0.07); rider.add(elbow);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), mat(0x222222));
    hand.position.set(s * 0.325, 1.10, -0.36); rider.add(hand);
    rider.add(limb([s * 0.22, 1.02, 0.02], [s * 0.37, 0.78, -0.25], 0.09, 0x33475e)); // 太もも
    rider.add(limb([s * 0.37, 0.78, -0.25], [s * 0.34, 0.30, -0.43], 0.08, 0x33475e)); // 脛
    rider.add(box(0.16, 0.10, 0.30, 0x222222, s * 0.34, 0.24, -0.47)); // 靴（フロア側）
  }
  rider.add(cyl(0.09, 0.10, 0.20, 0xf0c8a0, 0, 2.08, 0.02, 10)); // 首
  riderHeadParts = new THREE.Group(); riderHeadParts.position.set(0, 0, 0.02); rider.add(riderHeadParts);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 12, 10), mat(0xf0c8a0));
  head.position.set(0, 2.31, 0); riderHeadParts.add(head);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.23, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(0x3b5a80));
  helmet.position.set(0, 2.35, 0); riderHeadParts.add(helmet);

  // 木の出前箱（カメラ側＝+Z側の荷台）
  const crate = new THREE.Group(); crate.position.set(0, 0, TOWER_Z); bike.add(crate); // ベスパ後部シート上（上面 y=0.88）
  crate.add(box(1.24, 0.62, 0.72, 0xa9713f, 0, 1.19, 0));
  crate.add(box(1.26, 0.07, 0.74, 0x7a4f27, 0, 1.06, 0));
  crate.add(box(1.26, 0.07, 0.74, 0x7a4f27, 0, 1.38, 0));

  // 四角いざるの塔（出前箱の上）
  towerGroup = new THREE.Group();
  towerGroup.position.set(0, BOX_TOP, TOWER_Z); bike.add(towerGroup);
  const zaruCols = [0xe8c877, 0xdfb95c];
  for (let i = 0; i < 5; i++) {
    const p = new THREE.Group();
    const plate = box(TOWER_WIDTH, 0.11, ZARU_DEPTH, zaruCols[i % 2], 0, 0, 0);
    p.add(plate);
    p.add(box(TOWER_WIDTH, 0.03, 0.02, 0x8a6a2f, 0, -0.01, ZARU_DEPTH / 2 + 0.015)); // 前面のライン（カメラ側）
    // そばの盛り（最上段だけ薄く見せる）
    const soba = box(0.98, 0.05, 0.74, 0xf7ead2, 0, 0.08, 0);
    p.add(soba);
    p.position.y = i * ZARU_PITCH + 0.06;
    towerGroup.add(p); plateMeshes.push(p);
  }
  // 猪口（塔の一番上・警告役）
  chokoMesh = new THREE.Group();
  const cup = cyl(0.17, 0.13, 0.14, 0xf2f2f2, 0, 0.07, 0, 12);
  chokoMesh.add(cup);
  chokoMesh.add(cyl(0.17, 0.17, 0.035, 0xc0392b, 0, 0.15, 0, 12));
  towerGroup.add(chokoMesh);
  // 滑落中の演出用（猪口／ざるが横へ滑って落ちる）
  fallChokoMesh = new THREE.Group();
  fallChokoMesh.add(cyl(0.17, 0.13, 0.14, 0xf2f2f2, 0, 0.07, 0, 12));
  fallChokoMesh.visible = false; bike.add(fallChokoMesh);
  fallPlateMesh = box(TOWER_WIDTH, 0.11, ZARU_DEPTH, 0xdfb95c, 0, 0, 0);
  fallPlateMesh.visible = false; bike.add(fallPlateMesh);
}

// ---------- 3D同期：ゲーム状態 → 3Dオブジェクト ----------
function syncWorld() {
  const gy = slopeY(dist); // バイクのいる場所の地面の高さ。世界はこれを基準に持ち上がる
  // 道路（区間ごとの板。坂の区間では傾きに合わせて持ち上がる）
  const segBase = Math.floor(dist / 290) * 290;
  for (const s of roadSegs) {
    const D = segBase + (s.k - 2) * 290;
    const rel = D - dist;
    s.group.position.set(centerX(D), slopeY(D) - gy, -rel / UNIT);
    s.group.rotation.order = "YXZ"; // ヨー（曲がり）→ピッチ（坂）の順に回す
    s.group.rotation.y = -Math.atan(centerDeriv(D) * UNIT);
    s.group.rotation.x = -Math.PI / 2 + slopeDeriv(D) * UNIT;
    s.group.visible = rel > -600 && rel < 5200;
  }
  // 破線（坂に沿って高さと傾きを合わせる）
  for (const d of dashMeshes) {
    const rel = (Math.floor(dist / 120) + d.k) * 120 - dist;
    const D = dist + rel + 27;
    d.mesh.position.x = centerX(D) + d.bx; // 車線の左右2本（bx=±0.75）を中心線に沿わせる。中心線だけだと2本が中央に重なる
    d.mesh.position.z = -(rel + 27) / UNIT;
    d.mesh.position.y = slopeY(D) - gy + 0.012;
    d.mesh.rotation.x = slopeDeriv(D) * UNIT;
    d.mesh.visible = rel < 2600;
  }
  // 路側の小石と草（道のすぐ脇を流れる。速さの目安）
  for (const e of edgeMeshes) {
    const D = (Math.floor(dist / 100) + e.k - 1) * 100;
    const rel = D - dist;
    const side = (e.k % 2 === 0) ? -1 : 1;
    e.mesh.position.set(side * 3.05 + centerX(D), slopeY(D) - gy + 0.08, -rel / UNIT);
    e.mesh.visible = rel > -60 && rel < 2600;
  }
  // 路側の小物
  for (const p of propMeshes) {
    const idx = Math.floor(dist / 430) - 1 + p.k;
    const rel = idx * 430 - dist;
    const side = (idx % 2 === 0) ? -1 : 1;
    p.mesh.position.set(side * 3.7 + centerX(idx * 430), slopeY(idx * 430) - gy, -rel / UNIT);
    p.mesh.visible = rel > -150 && rel < 2600;
  }
  // 路側の家
  for (const h of houseMeshes) {
    const idx = Math.floor(dist / 690) - 1 + h.k;
    const rel = idx * 690 + 215 - dist;
    const side = (idx % 2 === 0) ? -1 : 1;
    h.mesh.position.set(side * 6.6 + centerX(idx * 690 + 215), slopeY(idx * 690 + 215) - gy, -rel / UNIT);
    h.mesh.visible = rel > -200 && rel < 2600;
  }
  // 松月庵（序盤・左側）
  shopGroup.position.x = -5.6 + centerX(200);
  shopGroup.position.z = -(200 - dist) / UNIT;
  shopGroup.position.y = slopeY(200) - gy;
  shopGroup.visible = dist < 1600;
  // 鳥居チェックポイント（中間地点）
  const relCp = CHECK_X - dist;
  checkpointGroup.position.x = centerX(CHECK_X);
  checkpointGroup.position.z = -relCp / UNIT;
  checkpointGroup.position.y = slopeY(CHECK_X) - gy;
  checkpointGroup.visible = relCp > -120 && relCp < 2600;
  // 段差
  const relStep = STEP_X - dist;
  stepGroup.position.x = centerX(STEP_X);
  stepGroup.position.z = -relStep / UNIT;
  stepGroup.position.y = slopeY(STEP_X) - gy;
  stepGroup.rotation.order = "YXZ";
  stepGroup.rotation.y = -Math.atan(centerDeriv(STEP_X) * UNIT);
  stepGroup.rotation.x = slopeDeriv(STEP_X) * UNIT;
  stepGroup.visible = !stepDone && relStep > -80 && relStep < 2400;
  // ジャンプ台
  const relJump = JUMP_X - dist;
  jumpGroup.position.x = centerX(JUMP_X);
  jumpGroup.position.z = -relJump / UNIT;
  jumpGroup.position.y = slopeY(JUMP_X) - gy;
  jumpGroup.rotation.order = "YXZ";
  jumpGroup.rotation.y = -Math.atan(centerDeriv(JUMP_X) * UNIT);
  jumpGroup.rotation.x = slopeDeriv(JUMP_X) * UNIT;
  jumpGroup.visible = !jumpDone && relJump > -80 && relJump < 2400;
  // 障害物（車線ごとに配置。通り過ぎたら隠す）
  for (const o of obstacleMeshes) {
    const rel = o.def.x - dist;
    o.mesh.position.x = centerX(o.def.x) + (o.def.lane - 1) * 90 / UNIT * 1.03;
    o.mesh.position.z = -rel / UNIT;
    o.mesh.position.y = slopeY(o.def.x) - gy;
    o.mesh.visible = rel > -80 && rel < 2400;
  }
  // 橋本さん宅（右側前方。ゴール時は手前に固定）
  let relHouse = GOAL_DIST - dist;
  if (state === "goal") relHouse = 620;
  goalHouse.position.set(5.6 + centerX(GOAL_DIST), slopeY(GOAL_DIST) - gy, -relHouse / UNIT);
  goalHouse.visible = relHouse > -200 && relHouse < 2600;
  // おばあちゃん（ゴール時のみ、家の前）
  grandma.visible = state === "goal";
  if (grandma.visible) grandma.position.set(3.1 + centerX(GOAL_DIST), slopeY(GOAL_DIST) - gy, -relHouse / UNIT + 2.6);

  // バイク（進路移動＋段差の跳ね＋走行の上下。道の中心線に沿って横へずれる）
  const bikeX = centerX(dist) + laneX / UNIT * 1.03 - peekF * 0.9; // laneX(±90) → レーン幅(±1.55)
  const bob = Math.sin(t * 18) * (speed > 5 ? 0.025 : 0) + hop * 0.14;
  bike.position.set(bikeX, gy + bob + jumpY, 0);
  // 地面の影はバイクと一緒に浮かせず、地面に残す（浮くほど小さく・薄く）
  if (groundShadow) {
    const shF = 1 / (1 + jumpY * 0.9);
    groundShadow.position.set(bikeX, gy + 0.015, 0);
    groundShadow.scale.set(1.02 * shF, 1.18 * shF, 1);
    groundShadowMat.opacity = 0.25 * shF;
  }
  // 塔：2D版と同じ「上の段ほど大きくずれる」表現
  towerGroup.rotation.z = sway * 0.10 + hitJolt * 0.10; // 描画のみ：衝突時の横への揺れ
  towerGroup.rotation.x = -theta * 0.90 - hitJolt * 0.30; // 描画のみ3倍（旧0.30→0.90）。物理のtheta・しきい値・失敗3段階には触れていない。
  // 衝突時の描画だけの前への揺れ（hitJolt、約0.5秒で消える）。物理の傾きとは別物。
  // 崩壊しきい値0.44では描画約23度、着地ピーク0.25では約13度になり、チェイス視点でも傾きが読める狙い。
  const failF = (state === "fail" && collapseT >= 0) ? Math.min(1, collapseT * 1.4) : 0;
  for (let i = 0; i < 5; i++) {
    const p = plateMeshes[i];
    p.visible = i < plates || failF > 0;
    if (!p.visible) continue;
    let ox = (sway * (i + 1) * 5 + Math.sin(theta) * (i + 1) * 2) / UNIT;
    let oz = -Math.sin(theta) * (i + 1) * 0.045;
    let oy = i * ZARU_PITCH + 0.06 - theta * (i + 1) * 0.02;
    let rz = 0;
    if (failF > 0) { // 崩壊：ざるが横に散りながら落ちる（2D版の散布式を移植）
      ox += ((i - 2) * 16 + failF * (i - 2) * 34) / UNIT;
      oy = i * ZARU_PITCH + 0.06 - failF * failF * 2.6 - i * 0.05;
      rz = failF * (i - 2) * 0.9;
    }
    p.position.set(ox, oy, oz);
    p.rotation.z = rz;
  }
  // 猪口（残り枚数の上。最上段プレートのずれに追随しつつ、隅オフセットを加える）
  const chokoOff = (sway * 6 * 5 + Math.sin(theta) * 6 * 2) / UNIT;
  chokoMesh.visible = choko;
  chokoMesh.position.set(chokoOff + CHOKO_DX, plates * ZARU_PITCH + 0.02, -Math.sin(theta) * 6 * 0.045 + CHOKO_DZ);
  // 滑落演出（描画のみ：1.8秒かけて滑り落ちる。従来1秒では実画面で見逃しやすかったため。物理・しきい値には触れていない）
  if (chokoFall >= 0 && chokoFall < 1.8) {
    const f = chokoFall / 1.8;
    fallChokoMesh.visible = true;
    fallChokoMesh.position.set(CHOKO_DX + f * 1.2, BOX_TOP + plates * ZARU_PITCH + 0.02 - f * f * 2.9, TOWER_Z + CHOKO_DZ);
    fallChokoMesh.rotation.z = -f * 1.2;
  } else fallChokoMesh.visible = false;
  if (slipFall >= 0 && slipFall < 1.8) {
    const f = slipFall / 1.8;
    fallPlateMesh.visible = true;
    fallPlateMesh.position.set(-0.33 + f * 1.35, BOX_TOP + plates * ZARU_PITCH + 0.35 - f * f * 2.7, TOWER_Z);
    fallPlateMesh.rotation.z = f * 0.8;
  } else fallPlateMesh.visible = false;
  // 運転手の頭（のぞくと少し横へ。2D版の -peekF*18 を踏襲）
  riderHeadParts.position.x = -peekF * 0.3;

  // カメラ：バイクの後ろから前方。のぞくとカメラが横に寄り、塔が脇へずれて道が見える
  // 距離・高さ・注視点は fitViewport() が画角とともに向き対応した camParams を使う
  // スピード感の演出（2026-11-06 C回。物理・数値には触れない）：
  // 速度が上がるほど視野角が広がり（最大+7°）、カメラがわずかに後ろへ引く（最大+0.6）。
  // 振動はごく小さく（±0.02）、塔の傾きの読み取りを邪魔しない程度に留める。
  const speedF = Math.min(1, Math.max(0, speed / 195));
  const camX = bikeX * 0.55 + peekF * 1.5;
  let cx = camX + Math.sin(t * 37) * 0.015 * speedF,
      cy = gy + camParams.height + peekF * 0.35 + Math.sin(t * 43) * 0.02 * speedF,
      cz = camParams.dist + speedF * 0.6;
  if (shake > 0) { cx += (Math.random() - 0.5) * shake * 0.02; cy += (Math.random() - 0.5) * shake * 0.02; }
  camera.position.set(cx, cy, cz);
  // カーブの先へ視線を少し寄せる（道が曲がる先を読むため。中心線の700先との差の半分）
  camera.lookAt(bikeX * 0.45 + peekF * 0.2 + (centerX(dist + 700) - centerX(dist)) * 0.5, gy + camParams.lookY, -12);
  camera.fov = camParams.fov + speedF * 7;
  camera.updateProjectionMatrix();
}

// ---------- DOMオーバーレイ（HUD／タイトル／ゴール／失敗） ----------
const hudEl = document.getElementById("hud"), hudTime = document.getElementById("hudTime"),
  hudPlates = document.getElementById("hudPlates"), hudBar = document.getElementById("hudBar"),
  hudNobi = document.getElementById("hudNobi"), hudDist = document.getElementById("hudDist"),
  kataEl = document.getElementById("kata"), peekEl = document.getElementById("peekLabel"),
  cpEl = document.getElementById("cpMsg"),
  centerEl = document.getElementById("center"), centerTitle = document.getElementById("centerTitle"),
  centerSub = document.getElementById("centerSub"),
  goalEl = document.getElementById("goalPanel"), goalL1 = document.getElementById("goalLine1"),
  goalL2 = document.getElementById("goalLine2"), goalL3 = document.getElementById("goalLine3"),
  bubbleEl = document.getElementById("bubble");
function syncUI() {
  // プレイ中のHUDはプレイ中だけ（ゴール表示との重なり防止。2D版セッションCの修正を踏襲）
  hudEl.style.display = state === "play" ? "block" : "none";
  if (state === "play") {
    hudTime.textContent = "タイム " + t.toFixed(1) + "秒";
    hudPlates.textContent = "ざる " + plates + "枚 ・ " + grade();
    const n = nobiPct();
    hudBar.style.width = Math.max(5, 200 * n / 100) + "px";
    hudBar.style.background = n >= 45 ? "#ffd166" : "#ff7b3c";
    hudNobi.textContent = "のび " + Math.round(n) + "%";
    let distText = "ゴールまで " + Math.max(0, Math.round((GOAL_DIST - dist) / UNIT)) + "m";
    if (!checkpointDone) distText += " ・ 鳥居まで " + Math.max(0, Math.round((CHECK_X - dist) / UNIT)) + "m";
    if (!stepDone) distText += " ・ 段差まで " + Math.max(0, Math.round((STEP_X - dist) / UNIT)) + "m";
    if (!jumpDone) distText += " ・ ジャンプ台まで " + Math.max(0, Math.round((JUMP_X - dist) / UNIT)) + "m";
    for (const o of OBSTACLES) { // 一番近い未通過の障害物までの距離
      if (!o.hit && dist < o.x) { distText += " ・ 障害物まで " + Math.max(0, Math.round((o.x - dist) / UNIT)) + "m"; break; }
    }
    hudDist.textContent = "速度 " + Math.round(speed * 0.6) + " / " + distText;
    kataEl.style.display = kataHold > 0 ? "block" : "none";
    peekEl.style.display = peeking ? "block" : "none";
  }
  // チェックポイント通過表示（2.2秒だけ。プレイ中のみ）
  if (state === "play" && checkpointShow > 0) {
    cpEl.style.display = "block";
    cpEl.textContent = "⛩️ チェックポイント　" + checkpointT.toFixed(1) + "秒";
  } else cpEl.style.display = "none";
  if (state === "title") {
    centerEl.style.display = "flex";
    centerTitle.textContent = "出前ダッシュ!!";
    centerSub.textContent = "タップ／Enterでスタート — 松月庵から橋本さん宅へ";
  } else if (state === "fail") {
    centerEl.style.display = "flex";
    centerTitle.textContent = failMsg;
    centerSub.textContent = "タップ／Enterでもう一度";
  } else centerEl.style.display = "none";
  if (state === "goal") {
    goalEl.style.display = "block";
    goalL1.textContent = "無事なざる " + plates + "枚！";
    goalL2.textContent = "タイム " + t.toFixed(1) + "秒 ・ 満足度 " + satisfaction() + "% ・ 評価 " + rank();
    goalL3.textContent = grade() + "　中間タイム " + checkpointT.toFixed(1) + "秒　タップ／Enterでもう一度";
    bubbleEl.style.display = "block"; // おばあちゃんの「ありがとね」
    if (firstRun) firstRun = false;
  } else { goalEl.style.display = "none"; bubbleEl.style.display = "none"; }
}

// ---------- フレーム ----------
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000 || 0.016); frame.last = now;
  update(dt);
  engineUpdate(); // エンジン音と風の音を速度に合わせる（演出のみ）
  if (hitJolt > 0) hitJolt = Math.max(0, hitJolt - dt * 1.8); // 描画のみ：衝突の揺れは約0.5秒で消える
  if (state === "goal") goalT += dt;
  if (state === "fail") collapseT += dt;
  syncWorld();
  syncUI();
  renderer.render(scene, camera);
}
/* 自動テスト用のデバッグフック（画面には出ない。2D版と同一） */
window.__demae = { start, changeLane,
  get state() { return state; }, get t() { return t; }, get dist() { return dist; },
  get speed() { return speed; }, get theta() { return theta; }, get sway() { return sway; },
  get plates() { return plates; }, get choko() { return choko; },
  get airborne() { return airT >= 0; }, get jumpY() { return jumpY; }, get jumpSpeed() { return jumpSpeed; },
  get checkpoint() { return checkpointDone; }, get checkpointT() { return checkpointT; },
  get obstacleHits() { return obstacleHits; },
  get braking() { return braking; }, keys,
  get course() { return COURSE; } };
addEventListener("resize", fitViewport);
fitViewport(); // 初期表示でもコンテナ（縦画面含む）に合わせる
requestAnimationFrame(frame);
</script>
</body>
</html>
