<title>出前ダッシュ!! 橋本さん宅プロトタイプ（3D版 土台v1）</title>
<style>
  html, body { margin:0; padding:0; background:#1b2a3a; height:100%; overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;
    touch-action:manipulation; /* 2026-11-07：ダブルタップ拡大の防止。manipulation＝ダブルタップズーム無効＋ピンチは可 */ }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  #gl { position:relative; width:960px; height:540px; max-width:100vw; max-height:78vh; aspect-ratio:16/9;
    border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.45); touch-action:none; background:#7ec8f7; }
  #gl canvas { display:block; width:100%; height:100%; }
  .overlay { position:absolute; pointer-events:none; }
  /* 2026-11-18 C：速度線は canvas に描く縦の筋へ作り直した（下の drawSpeedFx）。
     旧版は CSS の横帯（repeating-linear-gradient 180deg）で、「横棒が
     上から流れてきてる」と見え、速さの演出として失敗だったため廃止。
     canvas の中身は JS が描き、ここは配置だけ。表示だけの変更。 */
  #speedFx { inset:0; display:none; }
  #hud { top:12px; left:12px; background:rgba(0,0,0,.45); border-radius:10px; padding:10px 14px; color:#fff;
    font-size:15px; line-height:1.5; min-width:270px; max-width:430px; display:none; }
  /* 2026-11-06 B回：max-widthを追加。距離の行（速度／ゴール／鳥居／段差／障害物）が
     1行で右端まで伸び、空の太陽の円と重なって末尾が見にくくなることがあったため。
     幅を抑えて左側で折り返す。描画・表示だけの変更で物理・数値には触れていない。 */
  #hud .big { font-size:19px; font-weight:bold; }
  /* 2026-11-07：word-break:keep-all。「ジャンプ台まで」が「ジ／ャンプ台まで」と
     単語の途中で折り返されるのを防ぐ。表示だけの変更で物理・数値には触れない。 */
  #hudDist { word-break:keep-all; }
  #hudBarWrap { background:rgba(255,255,255,.35); border-radius:5px; height:10px; width:200px; margin:4px 0; display:inline-block; vertical-align:middle; }
  #hudBar { background:#ffd166; border-radius:5px; height:10px; width:100%; }
  #hudWarn { position:absolute; top:12px; right:16px; text-align:right; }
  #kata { color:#ffdd33; font-size:24px; font-weight:bold; display:none; }
  #cpMsg { top:24%; left:50%; transform:translateX(-50%); color:#fff; font-size:32px; font-weight:bold;
    text-align:center; white-space:nowrap; display:none; text-shadow:0 2px 0 #c0392b, 0 4px 14px rgba(0,0,0,.5); }
  #peekLabel { color:#fff; font-size:18px; font-weight:bold; display:none; }
  #center { inset:0; background:rgba(20,30,50,.55); color:#fff; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  #centerTitle { font-size:44px; font-weight:bold; }
  #centerSub { font-size:20px; margin-top:14px; text-wrap:balance; }
  #goalPanel { top:36px; left:50%; transform:translateX(-50%); width:500px; max-width:88%;
    background:rgba(20,30,50,.62); border-radius:14px; color:#fff; text-align:center; padding:16px 10px 14px; display:none; }
  #goalLine1 { font-size:40px; font-weight:bold; }
  #goalLine2 { font-size:22px; margin-top:8px; }
  #goalLine3 { font-size:18px; margin-top:6px; }
  /* 2026-11-19 B回・P2 3-6：ゴール結果の振り返り画面の整理。数字を「タイム・中間」
     と「満足度・評価・のび具合」に分け、ベストの行と「もう一度」の行を別にする。
     1行に詰め込んでいたため読みにくかった（goalLine3 に3種類が混ざっていた）。 */
  #goalLine4 { font-size:18px; margin-top:8px; color:#ffd166; }
  #goalRetry { font-size:15px; margin-top:10px; color:#cfe6f5; }
  #bubble { position:absolute; right:12%; bottom:24%; background:#fff; color:#333; border-radius:14px;
    padding:10px 18px; font-size:22px; font-weight:bold; display:none; }
  /* 2026-11-19 A回・第3週の演出：ゴール画面のおばあちゃんの顔（届いた枚数で表情が変わる）。
     素材は HTML に埋め込んだ縮小版（元画像を顔まわりで切り取り・360px・JPEG q88）。
     画像が読めないときは onerror で隠れ、文字の吹き出しだけが残る。 */
  #goalFace { width:200px; height:180px; object-fit:cover; object-position:center 10%;
    border-radius:12px; display:none; margin:0 auto 10px; }
  /* 2026-11-19 A回・P2 3-5：失敗の理由と次へのヒント。失敗画面の中央に小さく出す。 */
  #failHint { font-size:16px; margin-top:12px; color:#ffd166; line-height:1.6; max-width:560px; display:none; }
  /* 2026-11-19 A回・第3週の演出：大将の積み上げ。初回の走り出しだけ、ざるが1枚ずつ
     積まれるあいだ画面の上に小さく出す。走行中のHUDとは別枠。 */
  #stackMsg { top:38%; left:50%; transform:translateX(-50%); color:#fff; font-size:20px; font-weight:bold;
    text-align:center; white-space:nowrap; display:none; text-shadow:0 2px 0 rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.5); }
  /* 2026-11-19 B回・P2 3-4：初回プレイ向けチュートリアルの段階表示。初回の走行だけ、
     その場面に合った短い一言を出す。積み上げ表示と同じ場所（積み上げが終わってから
     出すので重ならない）。2回目以降は出ない。 */
  #tutMsg { top:38%; left:50%; transform:translateX(-50%); color:#fff; font-size:20px; font-weight:bold;
    text-align:center; white-space:nowrap; display:none; text-shadow:0 2px 0 rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.5); }
  /* 2026-11-15 GPT改善 1-1／1-2：起動できないときの案内（WebGL不可・読み込み失敗）。
     真っ暗な画面のままにしないための表示。通常時は出ない。 */
  #bootError { inset:0; background:rgba(20,30,50,.88); color:#fff; display:none; z-index:5;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px; }
  #bootErrorTitle { font-size:26px; font-weight:bold; }
  #bootErrorBody { font-size:16px; margin-top:14px; line-height:1.7; max-width:560px; }
  /* 2026-11-07 操作系の刷新（アクセル自動化・マリオカート式）：ボタンは進路・ブレーキ・のぞくの最小限に。
     進路は左手側、ブレーキは右手の親指に届く右下に大きく。のぞくはブレーキの隣に小さく。 */
  #pad { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:flex-end;
    width:100%; max-width:960px; padding:0 8px; box-sizing:border-box; }
  .padGroup { display:flex; gap:10px; align-items:center; }
  #pad button { font-size:20px; padding:14px 20px; border-radius:999px; border:0;
    background:#fff7e6; color:#333; box-shadow:0 3px 0 #c9a86a; touch-action:manipulation; }
  #bBrake { font-size:23px; padding:18px 30px; background:#ffe1a8; }
  #bPause, #bMute { font-size:18px; padding:14px 18px; background:#e8f4ff; } /* 2026-11-17 C（3-3）：一時停止ボタン。走行中・一時停止中だけ表示。bMute は 2026-11-18 A（6-1）で同じ見た目 */
  #pad button:active { transform:translateY(2px); box-shadow:0 1px 0 #c9a86a; }
  /* 2026-11-19 C（P2 2-4）：ボタンの押下状態とアクセシビリティ。長押しボタンは
     指がボタンの外へ滑っても .hold が残るため、:active と同じ沈んだ見た目にして
     押しているあいだが読めるようにする。トグルボタン（音・一時停止）は
     aria-pressed="true" のとき色を変え、オンの状態が文字だけでなく色でも読める
     ようにする。キーボード操作のときは :focus-visible でどこに焦点があるかをはっきり出す。 */
  #pad button.hold { background:#ffd166; transform:translateY(2px); box-shadow:0 1px 0 #c9a86a; }
  #pad button:focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
  #bMute[aria-pressed="true"], #bPause[aria-pressed="true"], #bLow[aria-pressed="true"] { background:#ffd166; }
  #hint { color:#cfe6f5; font-size:13px; margin-top:8px; text-align:center; padding:0 8px;
    max-width:960px; line-height:1.6; word-break:keep-all; }
  /* 縦画面（アスペクト比1未満）：ゲーム画面を縦に大きく取り、文字・ボタンを収める */
  @media (max-aspect-ratio: 1/1) {
    #gl { width:100vw; height:66vh; max-height:none; aspect-ratio:auto; border-radius:0; }
    #hud { font-size:13px; min-width:0; padding:8px 10px; top:8px; left:8px; }
    #hud .big { font-size:16px; }
    #hudWarn { top:8px; right:10px; }
    #kata { font-size:20px; }
    #cpMsg { font-size:23px; }
    #centerTitle { font-size:32px; }
    #centerSub { font-size:15px; padding:0 14px; }
    #goalPanel { top:16px; }
    #goalLine1 { font-size:28px; }
    #goalLine2 { font-size:16px; }
    #goalLine3 { font-size:14px; }
    #goalLine4 { font-size:14px; }
    #goalRetry { font-size:13px; }
    #bubble { font-size:17px; right:6%; bottom:20%; }
    #pad { padding:0 6px; }
    #pad button { font-size:19px; padding:15px 18px; }
    #bBrake { font-size:22px; padding:17px 26px; }
  }
  /* 2026-11-21 実機フィードバック（ユーザー撮影の横向き一時停止画面）：
     横向きは画面の背が低く、#gl（最大78vh）＋ボタン＋説明文が縦に収まらず、
     #wrap の中央寄せのせいで上が「一時停止中」の見出し、下が説明文の末尾が
     切れて見えなかった。背の低い画面では全体を詰めて1画面に収める。
     表示だけの変更で、物理・数値・状態の扱いは変えていない。 */
  @media (max-height: 540px) {
    #wrap { justify-content:flex-start; padding-top:6px; box-sizing:border-box; }
    #gl { height:54vh; width:auto; max-width:100vw; max-height:none; }
    #centerTitle { font-size:30px; }
    #centerSub { font-size:15px; margin-top:8px; padding:0 14px; }
    #failHint { font-size:13px; margin-top:8px; }
    #goalPanel { top:8px; padding:8px 8px 8px; }
    #goalFace { width:110px; height:84px; margin-bottom:4px; }
    #goalLine1 { font-size:26px; }
    #goalLine2 { font-size:15px; margin-top:4px; }
    #goalLine3 { font-size:13px; margin-top:3px; }
    #goalLine4 { font-size:13px; margin-top:4px; }
    #goalRetry { font-size:12px; margin-top:5px; }
    #hud { font-size:12px; padding:6px 9px; min-width:0; top:8px; left:8px; }
    #hud .big { font-size:15px; }
    #hudWarn { top:8px; right:10px; }
    #kata { font-size:19px; }
    #cpMsg { font-size:23px; }
    #pad { margin-top:6px; }
    #pad button { font-size:17px; padding:10px 14px; }
    #bBrake { font-size:20px; padding:12px 22px; }
    #bPause, #bMute { font-size:15px; padding:10px 12px; }
    #hint { font-size:11px; line-height:1.45; margin-top:4px; }
    /* 2026-11-21 実機：横向きで画面が細くなると、案内文（nowrap）が左右に
       はみ出して頭と尻尾が見切れた。背の低い画面では折り返して収める。 */
    #tutMsg, #stackMsg { white-space:normal; width:92%; font-size:16px; line-height:1.5; }
  }
  /* 2026-11-21：ホーム画面から起動したときは Safari の枠がない分、
     背の低い画面でも少し大きく、中央に置く（対応しない環境では効かないだけ）。 */
  @media (display-mode: standalone) and (max-height: 540px), (display-mode: fullscreen) and (max-height: 540px) {
    #wrap { justify-content:center; padding-top:0; }
    #gl { height:60vh; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="gl">
    <canvas id="speedFx" class="overlay"></canvas>
    <div id="hud" class="overlay">
      <div class="big" id="hudTime">タイム 0.0秒</div>
      <div class="big" id="hudPlates">ざる 5枚 ・ できたて！</div>
      <div><span id="hudBarWrap"><span id="hudBar" style="display:block"></span></span> <span id="hudNobi">のび 100%</span></div>
      <div id="hudDist" style="font-size:14px">速度 0 / ゴールまで 100m</div>
    </div>
    <div id="hudWarn" class="overlay"><div id="kata">カタカタ…</div><div id="peekLabel">のぞき中</div></div>
    <div id="cpMsg" class="overlay">⛩️ チェックポイント</div>
    <div id="stackMsg" class="overlay"></div>
    <div id="tutMsg" class="overlay"></div>
    <div id="center" class="overlay"><div id="centerTitle">出前ダッシュ!!</div><div id="centerSub"></div><div id="failHint"></div></div>
    <div id="goalPanel" class="overlay">
      <img id="goalFace" alt="橋本さんのおばあちゃん" onerror="this.style.display='none'">
      <div id="goalLine1">無事なざる 5枚！</div>
      <div id="goalLine2"></div>
      <div id="goalLine3"></div>
      <div id="goalLine4"></div>
      <div id="goalRetry">タップ／Enterでもう一度</div>
    </div>
    <div id="bubble">ありがとね</div>
    <div id="bootError" class="overlay"><div id="bootErrorTitle"></div><div id="bootErrorBody"></div></div>
  </div>
  <div id="pad">
    <div class="padGroup">
      <button type="button" id="bPause" aria-pressed="false">⏸ 一時停止</button>
      <button type="button" id="bMute" aria-pressed="false">🔊 音あり</button>
      <button type="button" id="bLow" aria-pressed="false">⚡ ふつう</button>
    </div>
    <div class="padGroup">
      <button type="button" id="bPeek" aria-pressed="false">のぞく（長押し）</button>
      <button type="button" id="bBrake" aria-pressed="false">ブレーキ（長押し）</button>

  chokoFall = -1; slipFall = -1; collapseT = -1; collapseSim = null; invuln = 0; shake = 0; hop = 0; truckHintT = 0; blinkT = 0; stunT = 0; slipDir = 1; chokoDir = 1; slipHintT = 0; chokoHintT = 0;
  stepDone = false; jumpDone = false; airT = -1; jumpY = 0; slowT = firstRun ? PHYS.slowTime : 0; goalT = 0; failMsg = ""; failHint = ""; truckHintDir = "右"; truckStreak = 0;
  stackShown = firstRun ? 0 : 5; stackT = 0; stackDoneT = 0; // 2026-11-19 A：初回だけ大将がざるを1枚ずつ積む。2回目以降は最初から5枚。
  checkpointDone = false; checkpointT = 0; checkpointShow = 0;
  for (const o of OBSTACLES) o.hit = false; obstacleHits = 0; resetScatter(); // 蹴散らした部品も元の位置へ戻す（2026-11-16 A）
  engineStart(); // エンジン音と風の音を始める（タイトル・ゴール・失敗時は無音）
}

// ---------- 更新（2D版からそのまま移植） ----------
function update(dt) {
  if (state !== "play") return;
  t += dt;
  // 2026-11-19 A回・大将の積み上げ（初回フル。表示だけ）：走り出しの約1.75秒で
  // ざるが1枚ずつ塔に積まれる。積まれるたびに小さな音がする。バイクはそのまま走り出す。
  if (stackShown < 5) {
    stackT += dt;
    while (stackT >= 0.35 && stackShown < 5) {
      stackT -= 0.35; stackShown++;
      if (stackShown < 5) noiseBurst(0.06, 0.10, 900);
      else { noiseBurst(0.08, 0.14, 1200); stackDoneT = 1.2; }
    }
  }
  if (stackDoneT > 0) stackDoneT -= dt;
  braking = btnBrake || !!keys["Space"];
  peeking = btnPeek || !!keys["KeyP"];
  peekF += ((peeking ? 1 : 0) - peekF) * Math.min(1, dt * 8);
  const slowF = slowT > 0 ? PHYS.slowFactor : 1; if (slowT > 0) slowT -= dt;
  // アクセル自動化（2026-11-07 ユーザー決定。2026-11-06の長押しアクセルは廃止）：
  // 上限速度は走り出し170から1秒に1.8ずつ上がり、33.3秒で230に達する。
  // 2026-11-16 A回：中間レビューでのユーザーの実機感想「簡単すぎるな。
  // 速度が遅い」を受けて、150→170・1.2/秒→1.8/秒・上限195→230へ引き上げ。
  // 走行中ずっと上がり続ける（ゴールまで上がり切らない）ので、ジャンプ台
  // （約23秒地点）では約210になる。速くなるほど段差・着地の衝撃が大きい
  // 既存の速度依存が、そのまま速さの代償になる（新しいペナルティは足さない）。
  // ブレーキで速度を落とす判断が中心になる。塔の物理の核・しきい値は無変更。
  const vmax = (PHYS.speedBase + Math.min(PHYS.speedCap - PHYS.speedBase, t * PHYS.speedRise)) * slowF;
  if (braking) speed = Math.max(0, speed - PHYS.brakeDecel * dt);
  else if (stunT > 0) speed = 0; // 跳ね返された直後はしばらく動かない（2026-11-12 Bの追記。速度0が表示で読めるようにするため。硬直中は加速しない）
  else speed = Math.min(vmax, speed + PHYS.accel * dt);
  const prevDist = dist; // 障害物の連続判定用：このフレームの始点
  dist += speed * dt;

  // 鳥居チェックポイント（中間地点。通過の記録と表示だけで、物理・評価・のびタイマーには触れない）
  if (!checkpointDone && dist >= CHECK_X) { checkpointDone = true; checkpointT = t; checkpointShow = 2.2; checkpointSound(); }
  if (checkpointShow > 0) checkpointShow = Math.max(0, checkpointShow - dt);

  // ジャンプ台（地形。段差の発展としてゴール手前に1つ置く。ボタンジャンプではない）
  if (!jumpDone && airT < 0 && dist >= JUMP_X) { jumpDone = true; airT = 0; airDur = PHYS.airBase + speed * PHYS.airPerSpeed; jumpSpeed = speed; }

  // ハンドル（ドラッグ／キー）：キーを押しっぱなしにしている間は目標位置が滑らかに動く
  // （1秒で200＝車線2つ分強。指を離したときと同様、横位置は中央へ自動では戻らない）。
  // ドラッグ中は pointermove が目標位置を直接動かす。どちらも同じ steerTarget を使う。
  if (keys["ArrowLeft"]) steerTarget = Math.max(-STEER_LIMIT, steerTarget - PHYS.keySteerRate * dt);
  if (keys["ArrowRight"]) steerTarget = Math.min(STEER_LIMIT, steerTarget + PHYS.keySteerRate * dt);

  // 車線のなめらかな移動（横方向の加速度が揺れになる）
  const targetX = steerTarget;
  const prevX = laneX;
  laneX += (targetX - laneX) * Math.min(1, dt * PHYS.laneEase);
  const latA = (laneX - prevX) / Math.max(dt, 1e-4);
  const peekGain = 1 + peekF * PHYS.peekGainK; // 覗いている間は片手運転で余計に揺れる

  // 塔の物理：傾きは運転入力だけで決まる（独りでに揺れる仕様はなし）
  // 調整根拠（2D版の自動走行テスト）：通常走行の最大傾きは約0.11、
  // 1回のブレーキで約0.26、ブレーキ＋進路変更＋のぞきの荒い運転で約0.38〜0.49
  // 空中（ジャンプ台で飛んでいる間）は運転入力が塔に伝わらない。
  // バネと減衰だけが働き、新しい傾きは生まれない。着地の衝撃は別途加える。
  const airborne = airT >= 0;

  if (!airborne) {
    if (braking) drive += PHYS.brakeDrive;            // ブレーキで前へ傾く
    else if (speed < vmax - 1 && stunT <= 0) drive += PHYS.accelDrive; // 加速で後ろへ傾く（上限が上がり続けるので、走行中はほぼ常に少し後ろへ傾く）。硬直中は加速していない（止まっているバイクは加速していない）ので、後ろ傾きを入れない。入れると衝突の前傾きを打ち消して塔がほとんど揺れなくなるため（壁のときと同じ理由）。
    drive += latA * PHYS.latDrive * peekGain;      // 進路変更の横揺れ（単独では猪口に届かず、ブレーキとの複合で滑落・崩壊に届く強さ）
  }

  theta += omega * dt;
  if (airborne) swayV += (-PHYS.swaySpring * sway - PHYS.swayDampAir * swayV) * dt;
  else swayV += (-PHYS.swaySpring * sway - PHYS.swayDamp * swayV + latA * PHYS.swayInput * peekGain) * dt; // 2026-11-11 B：グラグラをさらに強める（入力 0.020→0.035。実画面で滑らかなドラッグの見かけの傾きが 3〜5°しかなかったため。プローブ S：maxSway 0.171→約0.30、見かけの傾き 3.4°→約7.7°の見込み。sway は見た目だけ。theta の latA 係数 0.02 は据え置き）
  sway += swayV * dt;
  theta = Math.max(-PHYS.thetaMax, Math.min(PHYS.thetaMax, theta));

  // バイクのバンク（2026-11-14 A回。ユーザー指摘「蕎麦だけじゃなくて、バイクも傾かないと変だね」）。
  // 描画のみ：塔の物理の核・しきい値・失敗3段階には触れない。横移動の勢い（latA）に連動し、
  // 旋回方向へ傾く（左へ切る＝latA<0＝bank>0で上部が画面左へ。右へ切ると逆）。
  // bike グループ全体を傾けるので塔も一緒に傾くが、塔の bike に対する相対の傾き
  // （sway*0.45）は変わらないため、塔の傾きの読み取りはそのまま。指を離すと
  // latA→0 になり、バンクも真っ直ぐへ戻る（8/秒でなめらかに追従）。
  const bankTarget = Math.max(-BANK_MAX, Math.min(BANK_MAX, -latA * BANK_K));
  bank += (bankTarget - bank) * Math.min(1, dt * 8);

  // 小さな段差：1回だけの衝撃（いきなり崩壊する段差は置かない）。
  // 衝撃は速度依存：ゆっくり越えれば小さく、全速だと大きい
  if (!stepDone && dist >= STEP_X) { stepDone = true; omega += PHYS.stepJolt + speed * PHYS.stepJoltPerSpeed; hop = 1; }
  if (hop > 0) hop = Math.max(0, hop - dt * 3);

  // 障害物：進路変更を強いる。避ければ何も起きず、当たったら段差と同じ流儀で
  // 角速度へ衝撃を加える（段差と同程度）。
  // 2026-11-12 A回：軽トラ貫通バグの修正（ユーザー報告 2026-11-11 20:28・20:53）。
  // 旧判定は dist >= o.x の一点（障害物の中心）＋その1フレーム分の横位置だけ
  // だった。軽トラの車体は前後±81、バイクは前後±58あるため、見た目には
  // dist 1261 で前端が軽トラの後端に触れるのに、判定は 1400 まで火がつかず
  // 約0.86秒もめり込んだまま走り、途中でハンドルを切ると中心通過の瞬間の
  // 横位置だけが帯の外れて当たらないこともあった（プローブ TEST4 で再現）。
  // フレーム落ちで飛ぶ説はプローブで否定済み（しきい値チェック＋dt上限0.05
  // のため、ジッター／300msの空白でも 1400 で必ず火がつく）。
  // いまは連続判定：前フレームの後端から今フレームの前端までのバイクの区間と
  // 障害物の区間の重なりを見て、重なっているあいだ毎フレーム横位置も見る。
  // 見た目に触れた瞬間に当たる。完全に通り過ぎたら消費する（当たらず）。
  // 衝撃の大きさ（0.4 + speed*0.003）・塔の物理の核・しきい値は無変更。
  // 2026-11-12 A回（追記）：実画面では当たったことが読めなかったため、速度も落とす。
  // 公開版のブラウザ確認（11:14〜11:33）で、判定は触れた瞬間に火がついている
  // のに画面では反応が見えず、バイクが軽トラをすり抜けたままに見えた。理由は
  // 3つ：(1) カメラの揺れは ±0.04単位（数ピクセル、0.2秒）で小さすぎる、
  // (2) 塔の傾きのピークは軽トラの車体が画面をふさぐ瞬間に来る、
  // (3) 速度が変わらないので HUD の速度も世界の速さも手がかりにならない。
  // そこで障害物に当たったら速度も半分に落とす（speed *= 0.5）。止まった
  // ままにはならない（自動加速で速度は戻る）。塔への衝撃（0.4 + speed*0.003）
  // は切る前の速度で計算し、塔の物理の核・しきい値・失敗3段階は無変更。
  // 障害物に当たるとタイムを失うので、避ける意味がはっきりする。
  // カメラの揺れも 4→8 に強めた（描画のみ）。
  // 2026-11-12 A回（3つ目の手当て）：軽トラを壁にした。連続判定＋速度半減まで
  // 入れても、実画面のブラウザ確認では速度の落ちが 0.9秒で戻ってしまい、
  // バイクが軽トラの車体をすり抜ける様子は変わらず「直っていない」との報告
  // だった（2回とも）。速度の数字をサンプリングし損ねるほど短い減速では、
  // 当たったことが読めない。駐車中の車両は固いものなので、横が重なっている
  // あいだは前に進めない（壁）にした。実画面で「直った」と確認できた。
  // 2026-11-12 B回：壁をやめ、ノックバック＋短時間の点滅にした（ユーザー
  // 提案 2026-11-12 12:34「壁でピタッと止まるより、ノックバックして自機が

  // 困る人がいるうえ、止まること自体がゲームの流れを断ち切るため、よくある
  // 方式に寄せる。軽トラに当たると、接触点の約1.5m後ろへ跳ね返り、速度は0に
  // なり、1.2秒だけ自機が点滅する。軽トラは消費しないので、よけずに進めば
  // また当たる。重なるたびに跳ね返すため、壁と同じくすり抜けは起きない
  // （車体の区間を越えて前に進めない）。コーン・荷物は軽いものとして
  // 従来どおり（衝撃＋速度半減・1回だけ）。塔の物理の核・しきい値・失敗3段階
  // は無変更。
  // 点滅と3段階の無敵は別物（2026-11-12 B回の見直し）：軽トラのヒットでは
  // 共有の invuln（3段階の判定を守る無敵）を立てない。立てると、軽トラの
  // 脇でハンドルを切るたびに再ヒットして invuln が更新され続け、塔が
  // 0.44 を越えても崩壊しなくなる抜け道になる（自動走行Mで確認：最大傾き
  // 0.83でも崩壊せずゴールしてしまった）。跳ね返しで離れるため連打には
  // ならず、再び当たるには加速し直して接触点まで戻る必要がある（約1.4秒）。

  for (const o of OBSTACLES) {

    // 前フレームの位置から見ることで、フレーム間で飛び越えても逃さない。
    if (dist + BIKE_HALF_LEN >= o.x - halfLen && prevDist - BIKE_HALF_LEN <= o.x + halfLen) {
      if (!latOverlap) continue; // 脇を走っている（当たらない）
      if (o.type === "truck") {
        // 軽トラは固いので跳ね返る＋短い点滅（2026-11-12 B。壁からの変更）。
        // 消費しない（通り過ぎてしまえば下の else if で消費する）。
        // 3段階の無敵（invuln）は立てない（上記の見直しを参照）。
        obstacleHits++;
        omega += PHYS.stepJolt + speed * PHYS.stepJoltPerSpeed; hop = 1; noiseBurst(0.2, 0.2, 800);

        speed = 0;
        stunT = PHYS.truckStun; // しばらく動かない（2026-11-12 Bの追記。実画面のブラウザ確認で、跳ね返りが1フレームの後退＋即再加速では読めず、壁に張りついたように見えたため。速度0が0.6秒読め、跳ね返った位置で止まることで、跳ね返りが目に見えるリズムになる）
        blinkT = PHYS.truckBlink; // 点滅（描画は syncWorld で bike.visible を点滅）
        truckStreak++; // 同じ軽トラへの連続衝突。走行を始めたら0に戻る（start()）。
        truckHintDir = laneX < 0 ? "左" : "右"; // 2026-11-16 B：方向つきヒント。真後ろに張り付いて跳ね返りを繰り返す走行（11-14 C・11-16 Aで観測）では「ドラッグでよけよう」だけではどちらへ逃げればいいか読めないため、今いる側＝抜けやすい側を指す。中央ちょうど（laneX=0）のときは右を指す。
        // 2026-11-16 C：張り付きの手当て。2回目以降はヒントを強くする（「何度もぶつかっています」を付け、表示も2.5秒→4.0秒に延ばす）。
        // 3回目以降は、跳ね返りと同時にハンドルの目標位置をヒント方向へ30ずつずらす（上限は隣の車線の中心±90。軽トラの半幅70を越えるので脇に出られる）。
        // プレイヤーが既に車線の中心まで切っている（|steerTarget|>=90）ときは押し出さない（プレイヤーの操作と競合させない）。
        // 塔の物理の核・しきい値・失敗3段階・当たり判定は無変更（steerTarget はドラッグ／キーと同じ入力の目標値で、theta への入力経路は変わらない）。
        truckHintT = truckStreak >= PHYS.truckHintStrongFrom ? PHYS.truckHintRepeat : PHYS.truckHintFirst;
        if (truckStreak >= PHYS.truckNudgeFrom && Math.abs(steerTarget) < 90) {

        }

      } else {
        // 軽い障害物（コーン・荷物）は蹴散らす（2026-11-16 A回。ユーザー発案
        // 2026-11-15「ぶつかっても平気な障害物をけちらしたい」）。コーンや箱が
        // 物理っぽく飛び散り、ペナルティはごく小さな揺れだけにする（速度は落とさない。
        // 従来の衝撃 0.4+速度×0.003・速度半減はやめる）。重い軽トラは従来どおり
        // 跳ね返り＋スタン。塔の物理の核・しきい値・失敗3段階は無変更。
        o.hit = true;
        obstacleHits++;
        omega += PHYS.lightJolt + speed * PHYS.lightJoltPerSpeed; hop = 1; noiseBurst(0.2, 0.2, 800);
        initScatter(o);
        hitJolt = 1; shake = Math.max(shake, 8); // 描画のみ：当たった瞬間の揺れと画面のぶれ。物理には触れない。
      }
    } else if (prevDist - BIKE_HALF_LEN > o.x + halfLen) {
      o.hit = true; // 完全に通り過ぎた（当たらず）
    }
  }
  if (truckHintT > 0) truckHintT -= dt;
  if (slipHintT > 0) slipHintT -= dt;
  if (chokoHintT > 0) chokoHintT -= dt;
  if (blinkT > 0) blinkT -= dt;
  if (stunT > 0) stunT -= dt;

  // ジャンプ中の飛行と着地：飛ぶ距離と着地の衝撃は離陸時の速度で決まる。
  // 着地だけでは崩壊しない（きれいに速く飛んでも傾きのピークは約0.25で、
  // 猪口のしきい値0.30には届かず、警告の「カタカタ」範囲に収まる設計。
  // 2026-11-09 B回：自動加速で離陸速度が184前後になりピークが0.28〜0.29まで
  // 寄っていたため、着地の衝撃の式を 0.8+速度×0.010 → 0.9+速度×0.0075 に
  // 調整し、きれいな着地のピークを約0.24〜0.25に戻した（猪口まで約0.05の余裕）。
  // ブレーキで遅く飛んだときのピークは約0.20で、カタカタ（0.18超）は鳴る。
  // 塔のバネ・減衰・しきい値・失敗3段階は無変更。着地の衝撃は角速度として加え、
  // 傾きが育ってから3段階の判定にかかる。すでに傾いている状態で飛ぶと、
  // 着地で滑落・崩壊に進むこともある（3段階の範囲内）。
  if (airT >= 0) {
    airT += dt;
    jumpY = Math.sin(Math.PI * Math.min(1, airT / airDur)) * (PHYS.jumpHeightBase + jumpSpeed * PHYS.jumpHeightPerSpeed);
    if (airT >= airDur) { airT = -1; jumpY = 0; omega += PHYS.landJolt + jumpSpeed * PHYS.landJoltPerSpeed; hop = Math.max(hop, 0.6); noiseBurst(0.15, 0.15, 700); }
  }

  if (invuln > 0) invuln -= dt;
  const a = Math.abs(theta);
  // カタカタ：傾き連動の予告音（猪口のしきい値より手前から鳴る）
  if (a > PHYS.kataTheta) { kataAcc += dt; const iv = Math.max(0.06, 0.3 - a * 0.22);
    if (kataAcc > iv) { kataAcc = 0; noiseBurst(0.03, 0.12, 1800); } }
  if (a > PHYS.kataTheta) shake = Math.min(6, a * 8); else shake = Math.max(0, shake - dt * 20);
  // 「カタカタ…」の表示だけ、しきい値を割った後も0.9秒残す（見た目のみ。
  // 傾きの振動はしきい値をまたぐため、静止画では一瞬しか読めなかった対策）。
  // 物理・しきい値・音の条件は変えていない。

  // しきい値：猪口0.30／滑落0.35／崩壊0.44（通常走行の最大約0.11より十分上、
  // 1回のブレーキのピーク約0.26では猪口は落ちず、ブレーキ＋進路変更の
  // 荒い運転で滑落に届き、段差と複合した最も極端な運転でのみ崩壊に届く）
  // 判定は大きい方から行う：傾きはフレームごとに徐々に育つので、
  // 実際には猪口→滑落→崩壊の順に一段ずつ進む
  if (invuln <= 0) {
    if (a > PHYS.collapseTheta) { setState("fail"); collapseT = 0; failMsg = "塔が崩れてしまった…"; failHint = failHintFor(); thud(); noiseBurst(0.5, 0.3, 500); }
    else if (a > PHYS.slipTheta && plates > 0) { plates--; slipFall = 0; slipDir = sway >= 0 ? 1 : -1; slipHintT = 2.0; invuln = PHYS.slipInvuln; omega *= PHYS.slipOmegaDamp; noiseBurst(0.25, 0.2, 900); }
    else if (choko && a > PHYS.chokoTheta) { choko = false; chokoFall = 0; chokoDir = sway >= 0 ? 1 : -1; chokoHintT = 1.5; noiseBurst(0.15, 0.15, 2400); } // 猪口＝警告役、最初に滑る
  }
  if (chokoFall >= 0) chokoFall += dt;
  if (slipFall >= 0) slipFall += dt;

/* のびタイマー：麺の鮮度は時間で下がり、ざるを落とすとさらに下がる。
   評価は「到着タイム（→鮮度）× 残った枚数 × 満足度」で出す（第1週は暫定式、第3週で調整） */
// 2026-11-16 B（評価式の見直し。第3週の優先1位）：
// 従来は 100 - t×1.25 で、きれいな走行（30.2秒・5枚）でも満足度62%・評価Bどまりで、
// S（80%）には16秒で着く必要があり現実には届かなかった。時間の減り方は
// 30秒まではゆっくり（0.5/秒＝「できたて」の猶予）、それ以降は1.5/秒と二段にする。
// きれいな走行は約85%・S、45秒で約63%・B、枚数が落ちるとさらに下がる（2枚・35秒で約24%・C）。
// 表示だけの変更（のび％・満足度・評価・鮮度の文言）。塔の物理・しきい値・失敗3段階は無変更。
function nobiPct() { return Math.max(0, Math.min(100, 100 - Math.min(t, 30) * 0.5 - Math.max(0, t - 30) * 1.5 - (5 - plates) * 6 - (choko ? 0 : 4))); }
function grade() { const n = nobiPct();
  if (n >= 70) return "できたて！"; if (n >= 45) return "まだおいしい"; return "のびてきた…"; }
function satisfaction() { return Math.round(nobiPct() * plates / 5); }

// 5枚＝喜び、2〜4枚＝渋い顔、1枚＝激怒。吹き出しの文言だけが変わる（3Dモデルの表情は変えない）。
// 素材は GRANDMA_FACE_SRC に埋め込んだ縮小版（元画像は assets/grandma_*_01.png。第3週の結果画面用）。
function grandmaReaction() {
  if (plates >= 5) return "ありがとね！";
  if (plates >= 2) return "あらあら、こぼしちゃったねぇ";
  return "蕎麦一本しかないじゃないか！";
}
// 2026-11-19 B回・P2 3-6：ゴール結果の振り返り（自己ベスト）。ゴールした走行の
// うち一番速いタイムとそのときの枚数を localStorage（demae-best）に残す。
// ゴール画面の最初の1フレームでだけ読み書きする（毎フレームやると、
// 書き込みのたびに「ベスト更新！」が点滅してしまうため）。読めない環境
// （プライベートモード等）ではベストの行を出さない。表示だけの追加で、
// 塔の物理・しきい値・失敗3段階・評価には触れない。
function loadBest() {
  try {
    const raw = localStorage.getItem("demae-best");
    if (!raw) return null;
    const b = JSON.parse(raw);
    if (typeof b.t === "number" && typeof b.plates === "number") return b;
  } catch (e) {}
  return null;
}
function updateBest() {
  const prev = loadBest();
  bestUpdated = !prev || t < prev.t;
  if (bestUpdated) {
    bestTime = t; bestPlates = plates;
    try { localStorage.setItem("demae-best", JSON.stringify({ t, plates })); } catch (e) {}
  } else { bestTime = prev.t; bestPlates = prev.plates; }
  bestDone = true;
}

// ---------- 起動チェック（2026-11-15 GPT改善 1-1） ----------
// WebGL が使えない端末・ブラウザや、Renderer の初期化に失敗した場合は、
// 真っ暗な画面のままにせず、原因と対処を日本語で出す。詳細は console へ。
// ゲームの数値（物理・コース・しきい値）には一切触れない。
function bootFail(title, body, err) {
  if (err) console.error("[demae] " + title, err);
  if (typeof window !== "undefined" && typeof window.__demaeBootError === "function") {
    window.__demaeBootError(title, body);
  } else {
    const el = document.getElementById("bootError");
    if (el) {
      document.getElementById("bootErrorTitle").textContent = title;
      document.getElementById("bootErrorBody").textContent = body;
      el.style.display = "flex";
    }
  }
  throw new Error("demae boot failed: " + title); // 起動を止める（画面には案内が出ている）
}
function webglOK() {
  try {
    // node の自動走行ハーネスには canvas がないため、判定できる環境だけで判定する
    if (typeof document === "undefined" || typeof document.createElement !== "function") return true;
    if (typeof window === "undefined" || !window.WebGLRenderingContext) return false;
    const cv = document.createElement("canvas");
    return !!(cv.getContext("webgl2") || cv.getContext("webgl") || cv.getContext("experimental-webgl"));
  } catch (e) { console.error("[demae] WebGL check failed", e); return false; }
}
if (!webglOK()) {

}

}

// ---------- WebGLコンテキストの喪失・復旧とリソースの破棄（2026-11-21 C回・キュー 6-3） ----------
// GPUの都合などで3D表示（WebGLコンテキスト）が止まることがある。そのままでは
// 画面だけ止まってタイマーと塔の物理が進み続けてしまうため、失ったときは
// 走行中なら一時停止し（画面が見えなくなったときの自動停止・3-3 と同じ流儀）、
// 復旧しても自動では再開しない（タップ／Enter・ボタンで再開）。描画が止まって
// いるあいだに始めた・再開した走行も、次のフレームで同じく止める（frame() の
// ガード）。three.js（r160）は内部でも contextlost/restored を拾って描画の
// 再初期化をするが、ゲーム側の進行（タイマー・物理の凍結と案内）はここで行う。
// 復旧しても描画が戻らない場合は、ページの再読み込みで直る。
// ページを離れるとき（pagehide）には、シーンのジオメトリ・マテリアル・
// テクスチャとレンダラーの内部リソースを破棄する。破棄しても three.js は
// 次の描画で必要なものを描き直すため、タブを切り替えて戻ってきた場合
// （bfcache）もそのまま遊べる。何度呼んでも1回だけ効く。
let contextLost = false; // いま3D表示が止まっているか
function onContextLost(e) {
  if (e && typeof e.preventDefault === "function") e.preventDefault(); // 復旧できるよう、既定の破棄を止める
  contextLost = true;
  if (state === "play") pause(); // タイマー・塔の物理を凍らせる（3-3 と同じ）
}
function onContextRestored() {
  contextLost = false; // 描画は rAF の次の描画から戻る。止まっていた走行はそのまま止めておき、再開はプレイヤーに任せる
}
renderer.domElement.addEventListener("webglcontextlost", onContextLost);
renderer.domElement.addEventListener("webglcontextrestored", onContextRestored);
let disposed = false; // WebGLリソースを破棄したか
function disposeGame() {
  if (disposed) return;
  disposed = true;
  scene.traverse((o) => {
    if (o.geometry && typeof o.geometry.dispose === "function") o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (m.map && typeof m.map.dispose === "function") m.map.dispose();
      if (typeof m.dispose === "function") m.dispose();
    }
  });
  if (renderer && typeof renderer.dispose === "function") renderer.dispose();
}
addEventListener("pagehide", disposeGame);

// ---------- 画面の向き対応（2026-11-02 ユーザー希望：スマホの縦画面に合わせる） ----------
// 横長は従来どおり（FOV58・距離7.4・高さ3.05・注視点y1.5）。
// 縦長（アスペクト比<1）では FOV を広げ（58→68）、カメラを少し後ろ（7.4→8.2）と
// 上（3.05→3.3）へ引いて、塔とバイクと前方の道が横にはみ出さず、
// 小さくなりすぎないようにする。aspect から連続補間するので回転・リサイズにも追従する。
// 補間係数 p：aspect 1 で 0（横長パラメータ）、aspect 0.46 以下で 1（縦長パラメータ）。
const CAM_LAND = { fov: 58, dist: 7.4, height: 3.05, lookY: 1.5 };
const CAM_PORT = { fov: 68, dist: 8.2, height: 3.3, lookY: 1.5 };
let camParams = { fov: CAM_LAND.fov, dist: CAM_LAND.dist, height: CAM_LAND.height, lookY: CAM_LAND.lookY };
// ---------- 画面回転時の扱い（2026-11-21 A回・キュー 2-5） ----------
// 回転＝画面の向きが縦↔横に変わること（アスペクト比が 1 をまたぐ）。
// 走行中に回転したら自動で一時停止する（画面が見えなくなったときの自動停止と
// 同じ流儀。3-3）。回転のあいだはレイアウトもカメラも変わるため、走り続けたまま
// では公平に操れないから。タイマー・塔の物理は凍り、再開はボタン・Enter・画面
// タップ（3-3 と同じ）。タイトル・一時停止中・ゴール・失敗のときは状態は変わらず、
// 画面の大きさとカメラだけ合わせ直す。回転の検知は resize での向きの変化で見る。
// orientationchange も同じ処理を呼ぶ（resize が来ない端末への備え）。
// 同じ向きのままの大きさの変化（横→横など）では止めない。
let lastOrientation = null; // "landscape" | "portrait"
function onOrientationChange() {
  const w = glEl.clientWidth || 960, h = glEl.clientHeight || 540;
  const now = (w / h) >= 1 ? "landscape" : "portrait";
  if (lastOrientation !== null && now !== lastOrientation && state === "play") pause();
  lastOrientation = now;
}
function fitViewport() {
  const w = glEl.clientWidth || 960, h = glEl.clientHeight || 540;
  renderer.setSize(w, h);
  const aspect = w / h;
  camera.aspect = aspect;
  const p = Math.min(1, Math.max(0, (1 - aspect) / 0.54));
  const mix = (a, b) => a + (b - a) * p;
  camParams = { fov: mix(CAM_LAND.fov, CAM_PORT.fov), dist: mix(CAM_LAND.dist, CAM_PORT.dist),
    height: mix(CAM_LAND.height, CAM_PORT.height), lookY: mix(CAM_LAND.lookY, CAM_PORT.lookY) };
  camera.fov = camParams.fov;
  camera.updateProjectionMatrix();
  onOrientationChange();
}

function makeTextBoard(w, h, lines) {
  const g = new THREE.Group();
  g.add(box(w, h, 0.06, 0x2e4a5a, 0, 0, 0)); // 板の裏（濃い藍の縁）
  g.add(box(w - 0.12, h - 0.12, 0.02, 0xf5f0e6, 0, 0, 0.04)); // 白い面
  try {
    if (typeof document !== "undefined" && typeof document.createElement === "function") {
      const cv = document.createElement("canvas");
      cv.width = 256; cv.height = Math.round(256 * h / w);
      const cx = cv.getContext("2d");
      cx.fillStyle = "#f5f0e6"; cx.fillRect(0, 0, cv.width, cv.height);
      cx.textAlign = "center"; cx.textBaseline = "middle";
      for (const ln of lines) { // {text, size(px), y(0〜1の割合), color}
        cx.font = "bold " + ln.size + "px sans-serif";
        cx.fillStyle = ln.color || "#2e4a5a";
        cx.fillText(ln.text, cv.width / 2, cv.height * ln.y);
      }
      const tex = new THREE.CanvasTexture(cv);
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.12, h - 0.12),
        new THREE.MeshBasicMaterial({ map: tex }));
      plane.position.z = 0.06; g.add(plane);
    }
  } catch (e) { /* 文字なしの白い板のまま。描画だけの差 */ }
  return g;
}

function buildVespa() {
  const root = new THREE.Group(); root.name = "ベスパ (.pgl)";
  const layerGroups = new Map();
  for (const [id, name] of VESPA_PGL.layers) {
    const g = new THREE.Group(); g.name = name; layerGroups.set(id, g); root.add(g);
  }
  const buckets = new Map();
  for (const face of VESPA_PGL.faces) {
    const layer = face[0], color = VESPA_PGL.colors[face[1]], idx = face.slice(2);
    const key = layer + "|" + color;
    if (!buckets.has(key)) buckets.set(key, { layer, color, positions: [] });
    const pos = buckets.get(key).positions;
    const point = i => [VESPA_PGL.verts[i * 3], VESPA_PGL.verts[i * 3 + 1], VESPA_PGL.verts[i * 3 + 2]];
    for (let k = 1; k + 1 < idx.length; k++) { // 多角形を扇状に三角形化
      for (const i of [idx[0], idx[k], idx[k + 1]]) pos.push(...point(i));
    }
  }
  for (const b of buckets.values()) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(b.positions, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
      color: new THREE.Color(b.color), flatShading: true, side: THREE.DoubleSide
    }));
    layerGroups.get(b.layer).add(mesh);
  }
  // .pgl の前方 +z を、ゲームの前方 -Z へ向ける。
  root.rotation.y = Math.PI;
  return root;
}

// ---------- 道路（中心線に沿った1枚の帯。2026-11-09 A回） ----------
// 2026-11-08のユーザー指摘「カーブの道路、破れたみたいになってるね」の修正。
// 従来は5単位（290）ごとの板20枚を、それぞれ中心線の傾きで回して並べていた。
// カーブでは隣の板のヨー角が変わるため、継ぎ目で板の端がずれ、道路の端で
// 最大1単位（58コース単位）もの楔形の隙間ができ、その下の砂色の地面が
// 見えて「破れた」ように見えていた（直線区間では隙間はほぼ0）。
// 対策：道路をコース全体の1枚の帯（リボン）にし、頂点を中心線そのものに
// 置く。継ぎ目がなくなるので破れは原理的に起きない。白い縁取りも同じ
// 作りの細い帯にする。帯はコース座標で作り、毎フレーム dist/UNIT だけ
// z方向へずらす（他の物と同じスクロールの流儀）。物理・コースデータは無変更。
function makeRibbon(halfW, yOff, color, centerOff) {
  const positions = [], indices = [];
  const dFrom = -600, dTo = 6400, step = 145; // スタート手前600〜ゴール先600まで覆う
  let n = 0;
  for (let D = dFrom; D <= dTo; D += step) {
    const psi = -Math.atan(centerDeriv(D) * UNIT); // 道路の向き
    const cx = Math.cos(psi), sx = Math.sin(psi); // 幅方向 (cosψ, 0, -sinψ)
    const y = slopeY(D) + yOff, z = -D / UNIT, x0 = centerX(D);
    const l0 = (centerOff || 0) - halfW, l1 = (centerOff || 0) + halfW;
    positions.push(x0 + l0 * cx, y, z - l0 * sx, x0 + l1 * cx, y, z - l1 * sx);
    if (n > 0) {
      const a = (n - 1) * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    n++;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat(color));
  scene.add(mesh);
  return mesh;
}

// ---------- 崩壊の演出：ざるが物理っぽく飛ぶ・跳ねる・転がる ----------
// 2026-11-11 A回（ユーザー「物理エンジンてきなね」）。作り込みのアニメーションではなく、
// 初速度＋重力＋床での跳ね返り＋転がりの簡易シミュレーション（描画だけ。塔の物理・しきい値・失敗3段階には触れない）。
// 塔ローカル座標で計算する（純粋な数値計算。THREE の行列は使わない）。
// 床は2段：出前箱の上（y=0.06、箱の範囲 |x|<0.8 かつ |z|<0.7）と地面（y=-1.44＝箱の高さ分だけ下）。
// 箱から外へ飛んだざるは地面まで落ちて跳ねる。塔の傾き（最大約23°）で床が少し傾くのは簡易計算の範囲として許容する。
let collapseSim = null; // { bodies: [...5枚...], choko: {...}|null }
const COLLAPSE_G = 9.8;
function collapseFloorY(x, z) {
  return (Math.abs(x) < 0.8 && Math.abs(z) < 0.7) ? 0.06 : -1.44;
}
function initCollapseSim(plateBase, chokoBase, thetaSign) {
  const bodies = [];
  for (let i = 0; i < 5; i++) {
    bodies.push({ mesh: plateMeshes[i],
      x: plateBase[i].x, y: plateBase[i].y, z: plateBase[i].z,
      vx: (i - 2) * 1.2, vy: 1.2 + (i % 2) * 0.6, vz: -(0.5 + i * 0.25) * thetaSign, // 傾いた方向へ前に飛ぶ
      rz: 0, vr: (i - 2) * 2.2, settled: false });
  }
  let choko = null;
  if (chokoBase) {
    choko = { mesh: chokoMesh, x: chokoBase.x, y: chokoBase.y, z: chokoBase.z,
      vx: 1.8, vy: 2.0, vz: -0.6 * thetaSign, rz: 0, vr: -3.0, settled: false };
  }
  collapseSim = { bodies, choko };
}
function stepCollapse(dt) {
  if (!collapseSim) return;
  const step = (b) => {
    if (b.settled) return;
    b.vy -= COLLAPSE_G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.rz += b.vr * dt;
    const fy = collapseFloorY(b.x, b.z);
    if (b.y < fy) {
      b.y = fy;
      if (Math.abs(b.vy) > 0.6) { b.vy = -b.vy * 0.45; b.vx *= 0.65; b.vz *= 0.65; b.vr *= 0.6; }
      else { b.vy = 0; b.vx *= 0.5; b.vz *= 0.5; b.vr *= 0.5;
        if (Math.abs(b.vx) < 0.05 && Math.abs(b.vz) < 0.05 && Math.abs(b.vr) < 0.1) b.settled = true; }
    }
  };
  for (const b of collapseSim.bodies) step(b);
  if (collapseSim.choko) step(collapseSim.choko);
}

// ---------- 軽い障害物の蹴散らし（2026-11-16 A回。ユーザー発案 2026-11-15） ----------
// コーン・荷物に当たると、その部品（コーン3個／木箱6個とざる）が物理っぽく
// 飛び散る。崩壊シミュレーションと同じ流儀の簡易計算（重力・床での跳ね返り・
// 転がり）。描画だけ：塔の物理・しきい値・当たり判定・コースには触れない。
// 看板と旗は飛ばさない（遠くからの目印として残す）。軽トラは対象外。
// 部品の位置は障害物グループの中の相対座標で動かす（グループ自体はコース座標
// に固定されたままなので、飛んだ部品はコース上のその場所に残る）。
let scatterSims = []; // [{ parts: [...], age }]
function initScatter(o) {
  const entry = obstacleMeshes.find(m => m.def === o);
  if (!entry || !entry.parts) return;
  const parts = entry.parts.map(mesh => ({
    mesh, bx: mesh.position.x, by: mesh.position.y, bz: mesh.position.z,
    x: mesh.position.x, y: mesh.position.y, z: mesh.position.z,
    // 床の高さ：コーンの小グループは原点が地面（0.03）、木箱は中心が箱の半分（0.35）
    fy: Math.max(0.03, Math.min(mesh.position.y, 0.35)),
    vx: (Math.random() * 2 - 1) * 2.5, vy: 2 + Math.random() * 1.5,
    vz: -(1.5 + Math.random() * 2), // バイクから見て前方（コースの先）へ飛ぶ
    rz: 0, vr: (Math.random() * 2 - 1) * 8, settled: false }));
  scatterSims.push({ parts, age: 0 });
}
function stepScatter(dt) {
  for (const sim of scatterSims) {
    sim.age += dt;
    for (const p of sim.parts) {
      if (p.settled) continue;
      p.vy -= 9.8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rz += p.vr * dt;
      if (p.y < p.fy) {
        p.y = p.fy;
        if (Math.abs(p.vy) > 0.8) { p.vy = -p.vy * 0.4; p.vx *= 0.6; p.vz *= 0.6; p.vr *= 0.6; }
        else { p.vy = 0; p.vx *= 0.5; p.vz *= 0.5; p.vr *= 0.5;
          if (Math.abs(p.vx) < 0.05 && Math.abs(p.vz) < 0.05 && Math.abs(p.vr) < 0.1) p.settled = true; }
      }
      p.mesh.position.set(p.x, p.y, p.z);
      p.mesh.rotation.z = p.rz;
    }
  }
}
function resetScatter() {
  for (const sim of scatterSims) {
    for (const p of sim.parts) {
      p.mesh.position.set(p.bx, p.by, p.bz);
      p.mesh.rotation.z = 0;
      p.mesh.visible = true;
    }
  }
  scatterSims = [];
}

    d.mesh.position.z = -rel / UNIT;

  bike.visible = !blinkOff;

  towerGroup.rotation.x = -theta * 0.90 - hitJolt * 0.30; // 描画のみ3倍（旧0.30→0.90）。物理のtheta・しきい値・失敗3段階には触れていない。

  for (let i = 0; i < 5; i++) {
    plateBase.push({
      x: (sway * (i + 1) * 7 + Math.sin(theta) * (i + 1) * 2) / UNIT, // 2026-11-11 A：横ずれ係数 5→7（sway の増幅と合わせる）
      y: i * ZARU_PITCH + 0.06 - theta * (i + 1) * 0.02,
      z: -Math.sin(theta) * (i + 1) * 0.045 });
  }
  if (collapsing && !collapseSim) {
    const thSign = theta >= 0 ? 1 : -1;
    const chokoBase = choko ? {
      x: (sway * 6 * 7 + Math.sin(theta) * 6 * 2) / UNIT + CHOKO_DX,
      y: plates * ZARU_PITCH + 0.02,
      z: -Math.sin(theta) * 6 * 0.045 + CHOKO_DZ } : null;
    initCollapseSim(plateBase, chokoBase, thSign);
  }
  for (let i = 0; i < 5; i++) {
    const p = plateMeshes[i];
    p.visible = i < Math.min(plates, stackShown) || collapsing; // 2026-11-19 A：初回は大将が積むまで1枚ずつ。崩壊時は従来どおり5枚が飛び散る。
    if (!p.visible) continue;
    if (collapsing && collapseSim) {
      const b = collapseSim.bodies[i];
      p.position.set(b.x, b.y, b.z);
      p.rotation.z = b.rz;
    } else {
      p.position.set(plateBase[i].x, plateBase[i].y, plateBase[i].z);
      p.rotation.z = 0;
    }
  }
  // 猪口（残り枚数の上。最上段プレートのずれに追随しつつ、隅オフセットを加える）
  const chokoOff = (sway * 6 * 7 + Math.sin(theta) * 6 * 2) / UNIT; // 2026-11-11 A：横ずれ係数 5→7（プレートと合わせる）
  if (collapsing && collapseSim && collapseSim.choko) {
    const b = collapseSim.choko;
    chokoMesh.visible = true;
    chokoMesh.position.set(b.x, b.y, b.z);
    chokoMesh.rotation.z = b.rz;
  } else {
    chokoMesh.visible = choko && stackShown >= 5; // 2026-11-19 A：猪口は5枚目が積まれてから載る。
    chokoMesh.position.set(chokoOff + CHOKO_DX, plates * ZARU_PITCH + 0.02, -Math.sin(theta) * 6 * 0.045 + CHOKO_DZ);
    chokoMesh.rotation.z = 0;
  }
  // 滑落演出（描画のみ：1.8秒かけて滑り落ちる。従来1秒では実画面で見逃しやすかったため。物理・しきい値には触れていない）
  // 2026-11-13 A：滑る向きを塔の横の傾き（sway）の向きに合わせた。従来は常に右へ滑っていたため、左へ傾いたときに塔を横切って見えにくかった。
  if (chokoFall >= 0 && chokoFall < 1.8) {
    const f = chokoFall / 1.8;
    fallChokoMesh.visible = true;
    fallChokoMesh.position.set(chokoDir * (CHOKO_DX + f * 1.2), BOX_TOP + plates * ZARU_PITCH + 0.02 - f * f * 2.9, TOWER_Z + CHOKO_DZ);
    fallChokoMesh.rotation.z = -chokoDir * f * 1.2;
  } else fallChokoMesh.visible = false;
  if (slipFall >= 0 && slipFall < 1.8) {
    const f = slipFall / 1.8;
    fallPlateMesh.visible = true;
    fallPlateMesh.position.set(slipDir * (0.33 + f * 1.35), BOX_TOP + plates * ZARU_PITCH + 0.35 - f * f * 2.7, TOWER_Z);
    fallPlateMesh.rotation.z = slipDir * f * 0.8;
  } else fallPlateMesh.visible = false;
  // 運転手の頭（のぞくと少し横へ。2D版の -peekF*18 を踏襲）
  riderHeadParts.position.x = -peekF * 0.3;

  // カメラ：バイクの後ろから前方。のぞくとカメラが横に寄り、塔が脇へずれて道が見える
  // 距離・高さ・注視点は fitViewport() が画角とともに向き対応した camParams を使う
  // スピード感の演出（2026-11-06 C回。物理・数値には触れない）：
  // 速度が上がるほど視野角が広がり（最大+12°。2026-11-18 B：+7→+12）、カメラが
  // わずかに後ろへ引く（最大+1.2。2026-11-18 B：0.6→1.2）。振動も少し強める
  // （±0.035。塔の傾きの読み取りを邪魔しない程度に留める）。
  const speedF = Math.min(1, Math.max(0, speed / PHYS.speedCap)); // 2026-11-18 B：上限260に合わせる（直書き230をやめる）
  // 2026-11-18 C：見た目の速さの立ち上がり（visF）。速度そのもの（PHYS）は変えない。
  // vmax は 2.4/秒でしか上がらないため speedF は走行の終盤まで 1 にならず、
  // speedF に連動させていた視野角・カメラ引き・振動・速度線は最後まで弱い
  // ままだった。visF は speedF 0.25 で立ち上がり 0.85 で最大になるので、
  // 走り出しの数秒で演出がほぼ最大になり、速さの感じが早く来る。
  // 最大値（視野角+12°・カメラ引き1.2・振動±0.035）は従来どおり。
  const visF = Math.min(1, Math.max(0, (speedF - 0.25) / 0.6));
  const camX = bikeX * 0.55 + peekF * 1.5;
  let cx = camX + Math.sin(t * 37) * 0.03 * visF,
      cy = gy + camParams.height + peekF * 0.35 + Math.sin(t * 43) * 0.035 * visF,
      cz = camParams.dist + visF * 1.2;
  // 2026-11-18 C：速度線。visF が 0.15 を越えたあたりから端にだけ筋が出る
  // （最大で濃さ0.5）。走行中だけ。タイトル・ゴール・失敗時は消す。
  drawSpeedFx(state === "play" ? Math.max(0, (visF - 0.15) / 0.85) * 0.5 : 0, speedF);
  if (shake > 0) { cx += (Math.random() - 0.5) * shake * 0.02; cy += (Math.random() - 0.5) * shake * 0.02; }
  camera.position.set(cx, cy, cz);
  // カーブの先へ視線を少し寄せる（道が曲がる先を読むため。中心線の700先との差の半分）
  camera.lookAt(bikeX * 0.45 + peekF * 0.2 + (centerX(dist + 700) - centerX(dist)) * 0.5, gy + camParams.lookY, -12);
  camera.fov = camParams.fov + visF * 12;
  camera.updateProjectionMatrix();
}

// ---------- 速度線（2026-11-18 C。表示だけ。物理・数値には触れない） ----------
// 旧版は CSS の横帯（白い横線が下へ流れる）で、ユーザーの目には「横棒が
// 上から流れてきてる」と見え、速さの演出として失敗だった。作り直し：
// 2D canvas に縦の筋を描く。画面の左右の端だけに出し、中央（塔の読み取り）
// には出さない。筋は下へ速く流れ、速いほど長く・速く流れる。
// node ハーネスでは getContext がないので描かずに返す（ガードあり）。
const speedFxCtx = (speedFxEl && typeof speedFxEl.getContext === "function") ? speedFxEl.getContext("2d") : null;
let speedFxLastT = 0;
const speedStreaks = [];
function drawSpeedFx(fx, speedF) {
  if (lowPower) { if (speedFxEl) speedFxEl.style.display = "none"; return; } // 2026-11-22 C（6-4）：低負荷モードでは速度線を描かない（2Dの重ね描きも止める）
  if (!speedFxCtx) return;
  const cw = glEl.clientWidth || 960, ch = glEl.clientHeight || 540;
  if (speedFxEl.width !== cw || speedFxEl.height !== ch) { speedFxEl.width = cw; speedFxEl.height = ch; }
  speedFxEl.style.display = fx > 0 ? "block" : "none";
  speedFxCtx.clearRect(0, 0, cw, ch);
  if (fx <= 0) { speedFxLastT = t; return; }
  const fdt = Math.min(0.05, Math.max(0, t - speedFxLastT)); speedFxLastT = t;
  while (speedStreaks.length < 26) {
    const left = Math.random() < 0.5;
    speedStreaks.push({
      x: left ? Math.random() * 0.22 : 0.78 + Math.random() * 0.22,
      y: Math.random() - 0.2,
      len: 0.08 + Math.random() * 0.12,
      v: 0.7 + Math.random() * 0.6,
      a: 0.25 + Math.random() * 0.35
    });
  }
  // 下へ流れる速さ（画面の高さ/秒）。速いほど速く流れる。
  const flow = 0.5 + speedF * 2.0;
  speedFxCtx.lineCap = "round";
  for (const s of speedStreaks) {
    s.y += fdt * flow * s.v;
    if (s.y - s.len > 1) { // 下へ抜けたら上から出し直す（左右は入れ替えない）
      s.y = -s.len - Math.random() * 0.15;
      s.len = 0.08 + Math.random() * 0.12 + speedF * 0.15;
      s.v = 0.7 + Math.random() * 0.6;
      s.a = 0.25 + Math.random() * 0.35;
    }
    const x0 = s.x * cw, y0 = s.y * ch;
    const lenPx = s.len * ch * (0.7 + speedF * 0.6);
    // 少し外側へ傾ける（端ほど外へ広がる放射の感じ）
    const dx = (s.x - 0.5) * 0.25 * lenPx;
    speedFxCtx.strokeStyle = "rgba(255,255,255," + (fx * s.a).toFixed(3) + ")";
    speedFxCtx.lineWidth = 2;
    speedFxCtx.beginPath();
    speedFxCtx.moveTo(x0, y0);
    speedFxCtx.lineTo(x0 + dx, y0 + lenPx);
    speedFxCtx.stroke();
  }
}

// ---------- フレーム ----------
function frame(now) {
  requestAnimationFrame(frame);
  // 2026-11-21 C（6-3）：描画が止まっているあいだは走らせない（失った直後の
  // 一時停止は onContextLost が行い、止まっているあいだに始めた・再開した
  // 走行もここで止める）。再開は復旧してからプレイヤーが行う。
  if (contextLost && state === "play") pause();
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000 || 0.016); frame.last = now;
  update(dt);
  engineUpdate(); // エンジン音と風の音を速度に合わせる（演出のみ）
  if (hitJolt > 0) hitJolt = Math.max(0, hitJolt - dt * 1.8); // 描画のみ：衝突の揺れは約0.5秒で消える
  if (state === "goal") goalT += dt;
  if (state === "fail") { collapseT += dt; stepCollapse(dt); }
  // 2026-11-17 C（1-3／3-3）：ループの停止・再開の整理。rAF自体は止めず、
  // update() は state==="play" のときだけ進む（止まっている間はタイマー・
  // 物理が凍る）。一時停止中は蹴散らしの飛び散りも止めて場面を凍らせる。
  // 復帰時の巨大dtは、再開時の frame.last リセット（setState 内）と
  // dt 上限 0.05 の二重で防ぐ。
  if (state !== "pause") stepScatter(dt); // 蹴散らしたコーン・荷物の飛び散り（描画だけ。2026-11-16 A）
  syncWorld();
  syncUI();
  renderer.render(scene, camera);
}
/* 自動テスト用のデバッグフック（画面には出ない。2D版と同一）。
   2026-11-22 B（P2 7-4）：開発用と本番用の境界。ふだん遊ぶ URL では
   window.__demae は置かない。?debug=1 のときだけ最後の1行で置く。
   node のテストは location.search に "?debug=1" を入れて動かす。 */
const __demaeHook = { start, steerTo, pause, resume, setState, _onVisibilityChange: onVisibilityChange,
  _onOrientationChange: onOrientationChange, get orientation() { return lastOrientation; }, // 2026-11-21 A回・キュー 2-5：自動確認用。いまの画面の向き（landscape／portrait）。
  // 2026-11-21 C回・キュー 6-3：WebGLコンテキストの喪失・復旧とリソース破棄の自動確認用。
  // contextLost はいま3D表示が止まっているか、disposed は破棄したか。
  // _onContextLost／_onContextRestored は canvas のイベントと同じ受け口、_dispose は pagehide と同じ受け口。
  get contextLost() { return contextLost; }, get disposed() { return disposed; },
  _onContextLost: onContextLost, _onContextRestored: onContextRestored, _dispose: disposeGame,
  get state() { return state; }, get paused() { return state === "pause"; }, get t() { return t; }, get dist() { return dist; },
  get speed() { return speed; }, get theta() { return theta; }, get sway() { return sway; },
  get laneX() { return laneX; }, get steerTarget() { return steerTarget; },
  get bank() { return bank; },
  get plates() { return plates; }, get choko() { return choko; },
  get airborne() { return airT >= 0; }, get jumpY() { return jumpY; }, get jumpSpeed() { return jumpSpeed; },
  get checkpoint() { return checkpointDone; }, get checkpointT() { return checkpointT; },
  get obstacleHits() { return obstacleHits; },
  get invuln() { return invuln; },
  get blinkT() { return blinkT; },
  get truckHintT() { return truckHintT; }, get truckHintDir() { return truckHintDir; },
  get truckStreak() { return truckStreak; },
  get muted() { return muted; }, toggleMute, setMuted,
  // 2026-11-22 C回・キュー 6-4：低負荷モードの自動確認用。
  // pixelRatio は実際にレンダラーへ渡したピクセル比、speedFxShown は速度線が画面に出ているか。
  get lowPower() { return lowPower; }, toggleLowPower, setLowPower,
  get pixelRatio() { return appliedPixelRatio; },
  get speedFxShown() { return speedFxEl ? speedFxEl.style.display === "block" : false; },
  get btnAria() { return { brake: document.getElementById("bBrake").getAttribute("aria-pressed"), peek: document.getElementById("bPeek").getAttribute("aria-pressed"), pause: bPauseEl.getAttribute("aria-pressed"), mute: document.getElementById("bMute").getAttribute("aria-pressed"), low: document.getElementById("bLow").getAttribute("aria-pressed") }; }, // 2026-11-19 C（P2 2-4）：自動確認用。5つのボタンの押下状態。
  get lastError() { return lastError; }, get errorCount() { return errorCount; }, // 2026-11-19 C（P2 1-4）：自動確認用。予期しない例外の最新1件と件数。
  get satisfaction() { return satisfaction(); }, get rank() { return rank(); },
  get grade() { return grade(); }, get nobiPct() { return nobiPct(); },
  get grandmaReaction() { return grandmaReaction(); },
  get grandmaFaceFile() { return grandmaFaceFile(); },
  get stackShown() { return stackShown; },
  get stackDoneT() { return stackDoneT; },
  get failHint() { return failHint; },
  get bestTime() { return bestTime; }, get bestPlates() { return bestPlates; },
  get bestUpdated() { return bestUpdated; },
  get tutText() { return tutText; },
  get goalT() { return goalT; }, get collapseT() { return collapseT; },
  get slowT() { return slowT; },
  get slipDir() { return slipDir; }, get chokoDir() { return chokoDir; },
  get slipHintT() { return slipHintT; }, get chokoHintT() { return chokoHintT; },
  get slipFall() { return slipFall; }, get chokoFall() { return chokoFall; },
  get collapseSim() { return collapseSim; },
  get scatterSims() { return scatterSims; },
  get braking() { return braking; }, keys,
  get course() { return COURSE; },
  // 2026-11-20 A回・キュー 4-4：コースの検証結果（自動確認用）。
  // courseErrors は読み込み時に弾いたコースの理由（空なら何も弾いていない）。
  // courseValid はいま遊んでいるコースが検証に通っているか。
  get courseErrors() { return courseErrors; },
  // 2026-11-20 C回・キュー 5-2：読み込み時に版の移行をしたコースの記録。
  // 移行しなかった（すでに今の版だった）場合は null。形は { from, to, note }。
  get courseMigrated() { return courseMigrated; },
  get courseValid() { return DemaeCourse.validateCourse(COURSE).length === 0; } };
// 開発用の入り口は ?debug=1 のときだけ開く（7-4）。ふだん遊ぶ URL では
// window.__demae は置かず、ゲームの操作・内部の読み取りはできない。
if (DEV) window.__demae = __demaeHook;
addEventListener("resize", fitViewport);
addEventListener("orientationchange", fitViewport); // 2026-11-21 A回・キュー 2-5：resize が来ない端末への備え（fitViewport 内で向きの変化を見る）
fitViewport(); // 初期表示でもコンテナ（縦画面含む）に合わせる
requestAnimationFrame(frame);
